<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="把图文内容编排成 1080 宽的交付长图：一键导入 Word 或 AI 文字稿，8 套版式、17 种底纹、局部加粗、按比例切图，全部在浏览器本地完成。">
<title>长图交付</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@400;700&display=swap">
<style>
/* Layout: an instrument bar over two panes — a scrolling control rail at left, a sticky canvas stage at right; stacks to one column with an 编辑/预览 switch at phone width. The chrome stays neutral on purpose, so the eight poster palettes on the canvas are the only saturated thing on screen. */
:root{
  --paper:#e9ecf2; --panel:#fdfdfe; --raise:#ffffff; --sunk:#e8ebf1;
  --line:#d2d8e4; --line-soft:#e3e7ef;
  --ink:#1a2030; --ink-2:#5a6476; --ink-3:#8a93a4;
  --accent:#95551c; --accent-ink:#ffffff; --accent-soft:#f5e8da; --accent-line:#dcc2a4;
  --good:#1c6f54; --bad:#a32c3a;
  --shadow:0 1px 2px #1a203012, 0 8px 24px #1a20300f;
  --font:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15181f; --panel:#1d212a; --raise:#242934; --sunk:#141720;
  --line:#343a47; --line-soft:#282e3a;
  --ink:#eef0f5; --ink-2:#a3abba; --ink-3:#737d8d;
  --accent:#e3a86d; --accent-ink:#241603; --accent-soft:#33261a; --accent-line:#5a4530;
  --good:#5cc39f; --bad:#f0848f;
  --shadow:0 1px 2px #0006, 0 10px 30px #0005;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15181f; --panel:#1d212a; --raise:#242934; --sunk:#141720;
  --line:#343a47; --line-soft:#282e3a;
  --ink:#eef0f5; --ink-2:#a3abba; --ink-3:#737d8d;
  --accent:#e3a86d; --accent-ink:#241603; --accent-soft:#33261a; --accent-line:#5a4530;
  --good:#5cc39f; --bad:#f0848f;
  --shadow:0 1px 2px #0006, 0 10px 30px #0005;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---------- shell ---------- */
.shell{height:100%;display:flex;flex-direction:column;min-height:0}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;flex:0 0 auto;border-radius:10px;box-shadow:0 1px 2px #0b0e1426,0 4px 12px #0b0e1424}
.mark svg{width:100%;height:100%;display:block}
.brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.08em;white-space:nowrap}
.brand p{margin:1px 0 0;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.bar .grow{flex:1 1 auto;min-width:8px}
.bar-group{display:flex;align-items:center;gap:6px}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--raise);color:var(--ink);font-size:13px;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--ink-3)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn svg{width:15px;height:15px;flex:0 0 auto}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn.icon{padding:8px;min-width:34px;justify-content:center}
.btn.danger{color:var(--bad);border-color:var(--line)}
.btn.danger:hover:not(:disabled){border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,transparent)}

.seg{display:inline-flex;padding:2px;gap:2px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk)}
.seg button{border:0;background:transparent;color:var(--ink-2);padding:6px 11px;border-radius:7px;font-size:12.5px;transition:background .15s,color .15s}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--raise);color:var(--ink);font-weight:500;box-shadow:0 1px 2px #1a203014}

/* ---------- work area ---------- */
.work{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:var(--rail-w,minmax(330px,27vw)) 12px minmax(0,1fr);gap:0;background:var(--paper)}
.splitter{position:relative;cursor:col-resize;touch-action:none;background:var(--paper);outline-offset:-3px}
.splitter::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--line)}
.splitter span{position:absolute;top:50%;left:50%;width:6px;height:46px;border-radius:4px;transform:translate(-50%,-50%);
  background:var(--line);transition:background .15s,height .15s}
.splitter:hover span,.splitter:focus-visible span,.splitter.dragging span{background:var(--accent);height:64px}
body.resizing,body.resizing *{cursor:col-resize!important;user-select:none!important}
.rail{min-width:0;min-height:0;overflow:auto;background:var(--paper);
  padding-block:0 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px;overscroll-behavior:contain}
.railnav{position:sticky;top:0;z-index:3;display:flex;gap:8px;align-items:center;
  padding:12px 0 11px;background:linear-gradient(var(--paper) 72%,transparent)}
.railnav .seg{flex:1 1 auto}
.railnav .seg{padding:3px}
.railnav .seg button{flex:1 1 0;padding:8px 11px;font-size:13.5px}
.railnav .seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600;
  box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 35%,transparent)}

.stage{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--paper)}
.stagebar{flex:0 0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 16px;
  border-bottom:1px solid var(--line-soft);background:var(--panel)}
.dims{font-family:var(--mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.dims b{color:var(--ink);font-weight:500}
.canvaswrap{flex:1 1 auto;min-height:0;overflow:auto;padding:18px 16px 40px;display:flex;justify-content:flex-start;align-items:flex-start;cursor:grab;
  background:
    linear-gradient(45deg,var(--line-soft) 25%,transparent 25%,transparent 75%,var(--line-soft) 75%) 0 0/22px 22px,
    linear-gradient(45deg,var(--line-soft) 25%,transparent 25%,transparent 75%,var(--line-soft) 75%) 11px 11px/22px 22px,
    var(--paper)}
.canvaswrap.panning{cursor:grabbing;user-select:none}
#poster{display:block;width:100%;max-width:1080px;height:auto;flex:0 0 auto;margin:0 auto;border-radius:4px;box-shadow:0 2px 6px #1a203022,0 18px 44px #1a20301f;background:#fff}
.busy{position:absolute;inset:auto 0 0 0}

/* ---------- control groups ---------- */
.panel[hidden]{display:none!important}
.grp{margin:0 0 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.grp>h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);
  padding:13px 15px 0}
.grp>h2+.sub{margin:3px 15px 0;font-size:12px;color:var(--ink-3)}
.grp-body{padding:13px 15px 16px;display:flex;flex-direction:column;gap:15px}

.f{display:flex;flex-direction:column;gap:6px;min-width:0}
/* field names lead (dark, semibold, an accent tick); hints trail (small, muted) */
.f>label,.lab{font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px;flex-wrap:wrap;line-height:1.35}
.f>label::before,.lab::before{content:"";width:3px;height:13px;flex:0 0 auto;border-radius:2px;background:var(--accent)}
.lab .opt,.f>label .opt{font-size:11.5px;font-weight:400;color:var(--ink-3)}
.lab .opt::before,.f>label .opt::before{content:none}
.stagebar .lab{font-size:12px;font-weight:400;color:var(--ink-3)}
.stagebar .lab::before{display:none}
.f input[type=text],.f input:not([type]),.f textarea,.f select{width:100%;min-width:0;background:var(--sunk);
  border:1px solid var(--line-soft);border-radius:9px;padding:9px 10px;transition:border-color .15s,background .15s}
.f input:focus,.f textarea:focus,.f select:focus{background:var(--raise);border-color:var(--accent);outline:none}
.f textarea{resize:vertical;min-height:92px;line-height:1.65}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--ink);cursor:pointer;line-height:1.45}
.check input{margin:2px 0 0;accent-color:var(--accent);width:16px;height:16px;flex:0 0 auto}

/* slider rows */
.slide{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center}
.slide .lab{grid-column:1}
.slide output{grid-column:2;font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--sunk);
  border-radius:6px;padding:2px 7px;font-variant-numeric:tabular-nums}
.slide input[type=range]{grid-column:1/-1;width:100%;margin:0;accent-color:var(--accent)}

/* uploads */
.drop{border:1px dashed var(--line);border-radius:11px;background:var(--sunk);padding:14px 12px;text-align:center;
  font-size:12.5px;color:var(--ink-2);transition:border-color .15s,background .15s}
.drop.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.drop p{margin:0 0 8px}
.drop input[type=file]{display:none}
.drop .pick{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);
  border-radius:8px;background:var(--raise);font-size:12.5px}
.drop .pick:hover{border-color:var(--ink-3)}
.shot{display:flex;align-items:center;gap:10px;margin-top:9px;padding:7px;border:1px solid var(--line-soft);
  border-radius:9px;background:var(--raise)}
.shot img{width:52px;height:38px;object-fit:contain;border-radius:5px;background:var(--sunk);flex:0 0 auto}
.shot span{flex:1 1 auto;min-width:0;font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* chapters */
.chap{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--raise);overflow:hidden;
  box-shadow:0 1px 2px #1a20300d,0 4px 12px #1a20300a;transition:border-color .15s,box-shadow .15s}
.chap::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent-line);transition:background .15s}
.chap+.chap{margin-top:12px}
.chap>summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;
  padding:12px 12px 12px 16px;cursor:pointer;transition:background .15s}
.chap>summary::-webkit-details-marker{display:none}
.chap>summary:hover{background:color-mix(in srgb,var(--accent) 6%,var(--raise))}
.chap[open]{border-color:var(--accent-line);box-shadow:0 2px 4px #1a203012,0 12px 26px #1a203016}
.chap[open]::before{background:var(--accent)}
.chap[open]>summary{background:var(--accent-soft);border-bottom:1px solid var(--accent-line)}
.chap-no{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--accent);color:var(--accent-ink);
  font-family:var(--mono);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.chap-head{min-width:0}
.chap-mark{width:auto;padding:0 8px;font-family:inherit;font-size:12px;letter-spacing:.04em}
.chap-top::before,.chap-end::before{background:var(--ink-3)}
.chap-top .chap-mark,.chap-end .chap-mark{background:var(--ink);color:var(--raise)}
#addChap+.chap-end{margin-top:12px}
.chap-title{display:flex;align-items:center;gap:7px;min-width:0}
.chap-title strong{min-width:0;font-size:15px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chap-tag{flex:0 0 auto;padding:1px 6px;border-radius:5px;font-style:normal;font-size:10.5px;font-weight:500;
  color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line)}
.chap[open] .chap-tag{background:var(--raise)}
.chap-tag[hidden]{display:none}
.chap-head small{display:block;margin-top:3px;font-size:11.5px;color:var(--ink-3)}
.chev{width:28px;height:28px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;
  border:1px solid var(--line);background:var(--raise);color:var(--ink-2);
  transition:transform .3s cubic-bezier(.2,.8,.2,1),background .15s,color .15s,border-color .15s}
.chev svg{width:14px;height:14px;display:block}
summary:hover .chev{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent)}
details[open]>summary .chev{transform:rotate(180deg);border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
summary:focus-visible .chev{outline:2px solid var(--accent);outline-offset:2px}
.chap-body{padding:4px 14px 18px 18px;display:flex;flex-direction:column;gap:14px}
/* each field inside a chapter reads as its own small section */
.chap-body>.f+.f{padding-top:14px;border-top:1px dashed var(--line)}
.chap-ops{display:flex;gap:6px;align-items:center;padding-top:11px}
.chap-ops .grow{flex:1 1 auto}
.chap-ops .btn{padding:6px 9px;font-size:12px}

.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumb{position:relative;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--sunk)}
.thumb img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.thumb-ops{display:flex;border-top:1px solid var(--line)}
.thumb-ops button{flex:1 1 0;border:0;background:var(--raise);color:var(--ink-2);padding:5px 0;font-size:12px;line-height:1}
.thumb-ops button:hover:not(:disabled){background:var(--sunk);color:var(--ink)}
.thumb-ops button:disabled{opacity:.3;cursor:not-allowed}
.thumb-ops button.rm:hover{color:var(--bad)}
.thumb-ops button+button{border-left:1px solid var(--line)}

.rt{border:1px solid var(--line-soft);border-radius:9px;background:var(--sunk);overflow:hidden;transition:border-color .15s,background .15s}
.rt:focus-within{border-color:var(--accent);background:var(--raise)}
.rt-bar{display:flex;gap:3px;align-items:center;flex-wrap:wrap;padding:5px;border-bottom:1px solid var(--line-soft)}
.rt-bar button{min-width:30px;padding:4px 8px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--ink-2);font-size:13px;line-height:1.35}
.rt-bar button:hover{background:var(--paper);color:var(--ink)}
.rt-bar button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.rt-bar .rt-gap{flex:1 1 auto}
.rt-m{border-radius:3px;padding:0 3px;background:color-mix(in srgb,var(--accent) 26%,transparent);color:var(--ink)}
.rt-ed{min-height:116px;max-height:360px;overflow:auto;padding:9px 11px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;outline:none;cursor:text}
.rt-ed b{font-weight:700}
.rt-ed.serif{font-family:"Noto Serif SC","Noto Serif CJK SC","Songti SC","STSong",SimSun,serif}
.rt-ed mark{color:inherit;border-radius:2px;padding:0 1px;background:color-mix(in srgb,var(--accent) 26%,transparent)}

/* header line editor */
.hl-list{display:flex;flex-direction:column;gap:8px}
.hl-row{display:flex;flex-direction:column;gap:7px;padding:9px;border:1px solid var(--line);border-radius:11px;background:var(--raise)}
.hl-row:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.hl-top{display:flex;align-items:center;gap:2px}
.hl-top .hl-text{margin-right:4px}
.f .hl-text{flex:1 1 auto;min-width:0;padding:7px 9px;line-height:1.3;color:var(--ink)}
.hl-tools{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.hl-tools select{width:auto;flex:1 1 0;min-width:0;padding:5px 6px;font-size:12px}
.hl-size{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--sunk);overflow:hidden}
.hl-size button{border:0;background:none;width:26px;height:28px;font-size:15px;color:var(--ink-2);cursor:pointer}
.hl-size button:hover{background:var(--raise);color:var(--accent)}
.f .hl-size input{width:44px;padding:0;border:0;border-radius:0;background:transparent;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.hl-size input::-webkit-inner-spin-button,.hl-size input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.hl-b{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--ink-2);cursor:pointer}
.hl-b[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hl-ic{width:24px;height:28px;flex:0 0 auto;border:0;border-radius:7px;background:none;color:var(--ink-3);cursor:pointer;font-size:14px}
.hl-ic:hover:not(:disabled){background:var(--sunk);color:var(--ink)}
.hl-ic:disabled{opacity:.3;cursor:default}
.hl-tools .grow{flex:1 1 auto}
.hl-add{justify-content:center;border-style:dashed;color:var(--accent)}
.hl-auto{border:0;background:none;padding:4px 4px;font-size:11.5px;color:var(--accent);cursor:pointer;border-radius:6px;white-space:nowrap}
.hl-auto:hover{background:var(--accent-soft)}
.hl-auto[hidden]{display:none}
.f .hl-size input::placeholder{color:var(--ink-3)}

/* one-click import */
.imp-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.imp-steps li{display:flex;flex-direction:column;gap:6px;padding:9px 9px 10px;border-radius:10px;background:var(--sunk);font-size:11.5px;line-height:1.45;color:var(--ink-2)}
.imp-steps b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:11.5px}
.imp-prompts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.imp-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:11px 12px;text-align:left;cursor:pointer;
  border:1px solid var(--accent-line);border-radius:11px;background:var(--accent-soft);color:var(--ink);transition:border-color .15s,transform .12s,background .15s}
.imp-card strong{font-size:13px;font-weight:600;color:var(--accent)}
.imp-card small{font-size:11.5px;color:var(--ink-2)}
.imp-card::after{content:"复制";position:absolute;top:10px;right:10px;font-size:11px;color:var(--accent);opacity:.75}
.imp-card:hover{border-color:var(--accent)}
.imp-card:active{transform:scale(.97)}
.imp-card.done{background:var(--accent);border-color:var(--accent)}
.imp-card.done strong,.imp-card.done small,.imp-card.done::after{color:var(--accent-ink)}
.imp-card.done::after{content:"已复制 ✓";opacity:1}
.imp-link{align-self:flex-start;border:0;background:none;padding:2px 0;font-size:12px;color:var(--ink-2);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.imp-link:hover{color:var(--accent);text-decoration-color:var(--accent)}
#impText{min-height:92px;resize:vertical;font-size:12.5px;line-height:1.6}
.imp-report{padding:10px 12px;border-radius:10px;border:1px solid var(--accent-line);background:var(--accent-soft);font-size:12.5px;line-height:1.6;color:var(--ink)}
.imp-report p{margin:0}
.imp-report p+p{color:var(--ink-2);font-size:12px}
.hints{display:flex;flex-wrap:wrap;gap:6px}
.hint{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:4px 4px 4px 9px;border-radius:999px;font-size:12px;
  color:var(--accent);background:var(--accent-soft);border:1px dashed var(--accent-line)}
.hint svg{width:14px;height:14px;flex:0 0 auto}
.hint span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint button{border:0;background:none;color:inherit;width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1}
.hint button:hover{background:var(--raise)}

/* logo picker */
.lpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.lpick button{display:flex;flex-direction:column;gap:5px;min-width:0;padding:6px 6px 7px;border:1px solid var(--line);border-radius:11px;
  background:var(--raise);cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .12s}
.lpick button:hover{border-color:var(--accent-line)}
.lpick button:active{transform:scale(.97)}
.lpick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lp-face{height:46px;display:grid;place-items:center;border-radius:7px;background:#ffffff;padding:5px 7px;overflow:hidden;box-shadow:inset 0 0 0 1px #1a203012}
.lp-face img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.lp-text{font-size:13px;font-weight:700;color:#1a2030;white-space:nowrap;text-overflow:ellipsis;justify-content:stretch;text-align:center}
.lp-add{background:var(--sunk);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-3);font-size:20px;border:0}
.lpick small{font-size:11.5px;color:var(--ink-2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lpick button[aria-pressed="true"] small{color:var(--accent);font-weight:600}

/* collapsible style groups */
.foldbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.foldbar-lab{font-size:12px;color:var(--ink-3);letter-spacing:.02em}
.foldbar-lab b{color:var(--accent);font-weight:700;font-size:13px}
.foldbar-seg{display:inline-flex;gap:3px;padding:3px;border-radius:999px;background:var(--sunk);border:1px solid var(--line)}
.foldbar button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink-2);
  font-size:13px;font-weight:600;padding:7px 14px 7px 12px;border-radius:999px;
  transition:background .22s,color .22s,box-shadow .22s,transform .12s}
.foldbar button svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.foldbar button path{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.foldbar button:hover{color:var(--accent);background:var(--raise);box-shadow:0 1px 3px #1a203018}
.foldbar button[data-foldall="0"]:hover .i-a{transform:translateY(1.5px)}
.foldbar button[data-foldall="0"]:hover .i-b{transform:translateY(-1.5px)}
.foldbar button[data-foldall="1"]:hover .i-a{transform:translateY(-1.5px)}
.foldbar button[data-foldall="1"]:hover .i-b{transform:translateY(1.5px)}
.foldbar button:active{transform:scale(.94)}
.foldbar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);
  box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 38%,transparent)}
@media (prefers-reduced-motion: reduce){.foldbar button,.foldbar button path{transition:none}}
details.fold>summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;transition:background .15s;
  padding:12px 15px;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:hover{background:var(--sunk)}
details.fold>summary h2{margin:0;padding:0;font-size:14px;font-weight:600;letter-spacing:.01em;color:var(--ink)}
details.fold>summary:focus-visible{outline:none}
details.fold>summary .sub{margin:3px 0 0;padding:0;font-size:12px;color:var(--ink-3)}
details.fold:not([open])>summary .sub{display:none}
details.fold>.grp-body{padding-top:14px}
details.fold{transition:border-color .15s}
details.fold[open]{border-color:var(--accent-line)}
details.fold[open]>summary{background:color-mix(in srgb,var(--accent) 7%,var(--panel));border-bottom:1px solid var(--accent-line)}
.mod-ic{width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;border-radius:10px;
  background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line)}
.mod-ic svg{width:18px;height:18px;display:block}
/* the chapter list sits on a sunk tray, so every white chapter card reads as its own object */
details.fold[data-fold="图文篇章"]>.grp-body{background:var(--sunk);padding:14px 12px 16px}
#addChap{margin-top:4px;padding:11px;border:1.5px dashed var(--accent-line);background:var(--raise);color:var(--accent);font-weight:600}
#addChap:hover{border-color:var(--accent);background:var(--accent-soft)}

/* pattern picker: plain text options */
.pgroup{display:flex;flex-direction:column;gap:7px}
.pgroup-name{font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--ink-3)}
.pgallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.popt{display:flex;flex-direction:column;gap:1px;min-width:0;padding:7px 9px;text-align:left;
  border:1px solid var(--line);border-radius:9px;background:var(--raise);color:var(--ink);transition:border-color .15s,background .15s}
.popt:hover{border-color:var(--ink-3)}
.popt strong{font-size:12.5px;font-weight:500}
.popt small{font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.popt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.popt[aria-pressed="true"] small{color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--raise);color:var(--ink-2);font-size:12.5px}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.chip .dot{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px #0002}
.chips input[type=color]{width:34px;height:30px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--raise);cursor:pointer}

/* theme gallery */
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.tile{padding:0;min-width:0;border:1px solid var(--line);border-radius:11px;background:var(--raise);overflow:hidden;text-align:left;
  transition:border-color .15s,box-shadow .15s}
.tile:hover{border-color:var(--ink-3)}
.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 32%,transparent)}
.tile canvas{display:block;width:100%;aspect-ratio:1080/1000;background:var(--sunk)}
.tile-meta{display:block;padding:5px 7px 7px;border-top:1px solid var(--line-soft)}
.tile-meta strong{display:block;font-size:12px;font-weight:500}
.tile-meta small{display:block;margin-top:1px;font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.sw{display:flex;flex-direction:column;gap:5px}
.sw span{font-size:11px;color:var(--ink-2)}
.sw input[type=color]{width:100%;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;
  background:var(--raise);cursor:pointer}

/* format bar */
.fmt{display:flex;gap:5px;flex-wrap:wrap}
.fmt button{min-width:38px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--raise);
  color:var(--ink-2);font-size:13px}
.fmt button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}

/* output panel */
.ratios{display:flex;flex-direction:column;gap:7px}
.ratio{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 11px;
  border:1px solid var(--line);border-radius:10px;background:var(--raise);cursor:pointer;transition:border-color .15s}
.ratio:hover{border-color:var(--ink-3)}
.ratio[data-on="1"]{border-color:var(--accent);background:var(--accent-soft)}
.ratio input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.ratio b{font-weight:500;font-size:13px}
.ratio small{display:block;color:var(--ink-3);font-size:11px;margin-top:1px}
.ratio .cnt{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .track{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter .fill{height:100%;background:var(--good);transition:width .3s,background .3s}
.meter .fill[data-level="warn"]{background:var(--accent)}
.meter .fill[data-level="full"]{background:var(--bad)}
.meter p{margin:0;font-size:11.5px;color:var(--ink-3)}
.notice{margin:0;padding:10px 11px;border-radius:9px;font-size:12.5px;border:1px solid var(--accent-line);
  background:var(--accent-soft);color:var(--ink);display:flex;gap:8px;align-items:flex-start}
.notice[hidden]{display:none!important}
.notice svg{width:15px;height:15px;flex:0 0 auto;margin-top:2px;color:var(--accent)}
.foot{margin:2px 2px 0;font-size:11.5px;color:var(--ink-3);line-height:1.6}

/* toast */
.toast{position:fixed;left:50%;transform:translate(-50%,14px);bottom:calc(20px + env(safe-area-inset-bottom,0px));
  z-index:40;display:flex;align-items:center;gap:12px;max-width:min(520px,calc(100vw - 32px));
  padding:11px 14px;border-radius:11px;background:var(--ink);color:var(--paper);font-size:13px;
  box-shadow:0 10px 34px #0005;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:1px solid #ffffff44;background:transparent;color:inherit;border-radius:7px;padding:4px 10px;font-size:12px}
.toast button:hover{background:#ffffff1f}

/* phone */
.viewswitch{display:none}
@media (max-width:860px){
  .work{grid-template-columns:minmax(0,1fr)!important;gap:0}
  .splitter{display:none}
  .rail{padding-right:max(16px,env(safe-area-inset-right,0px))}
  .stage{border-top:1px solid var(--line)}
  .viewswitch{display:inline-flex}
  .work[data-view="edit"] .stage{display:none}
  .work[data-view="preview"] .rail{display:none}
  .brand p{display:none}
  .swatches{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:460px){
  .brand h1{font-size:14px}
  .bar{gap:8px}
  .bar .label{display:none}
  .btn.primary .label{display:inline}
  .two{grid-template-columns:1fr}
}

  <div class="work" id="work" data-view="edit">

<script>
"use strict";
const $=s=>document.querySelector(s), W=1080, MAX_H=16384;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));

/* ---------------- rich body text ----------------
   A section's body is stored as runs — [{t:'文字', b:1, i:1, u:1, m:1}] — so any
   stretch of characters can carry its own bold / italic / underline / emphasis.
   sec.text keeps the plain string alongside, for older files and summaries. */
const FLAGS=['b','i','u','m'];
const NOFLAG={b:false,i:false,u:false,m:false};
function packRun(t,f){const r={t};for(const k of FLAGS)if(f&&f[k])r[k]=1;return r}
function toChars(runs){
  const out=[];
  for(const r of runs||[])for(let k=0;k<r.t.length;k++)
    out.push({c:r.t[k],b:!!r.b,i:!!r.i,u:!!r.u,m:!!r.m});
  return out;
}
function toRuns(chars){
  const out=[];
  for(const ch of chars){
    const f=ch.c==='\n'?NOFLAG:ch;     /* a line break carries no style */
    const last=out[out.length-1];
    if(last&&FLAGS.every(k=>!!last[k]===!!f[k]))last.t+=ch.c;
    else out.push(packRun(ch.c,f));
  }
  return out;
}
const plainOf=runs=>(runs||[]).map(r=>r.t).join('');
function runsFromText(text,f){const t=String(text??'');return t?toRuns(toChars([packRun(t,f)])):[]}
function cleanRuns(arr){
  if(!Array.isArray(arr))return null;
  const out=[];
  for(const r of arr){if(!r||typeof r.t!=='string')return null;out.push(packRun(r.t,r))}
  return toRuns(toChars(out));
}
function richOf(sec){
  return Array.isArray(sec.rich)&&plainOf(sec.rich)===String(sec.text??'')
    ?sec.rich:runsFromText(sec.text);
}
/* older drafts had one bold/italic/underline switch for all body text; fold it
   into the runs so the look survives, then retire the switch */
function migrateBody(st){
  const lf={b:!!st.bodyBold,i:!!st.bodyItalic,u:!!st.bodyUnderline};
  for(const sec of st.sections){
    const clean=cleanRuns(sec.rich);
    sec.rich=clean&&plainOf(clean)===String(sec.text??'')?clean:runsFromText(sec.text,lf);
    sec.text=plainOf(sec.rich);
  }
  st.bodyBold=st.bodyItalic=st.bodyUnderline=false;
}
function listify(runs){
  const out=[];let para=[];
  const flush=()=>{
    if(para.some(ch=>ch.c.trim())){
      if(out.length)out.push({c:'\n',...NOFLAG});
      out.push({c:'•',...NOFLAG},{c:' ',...NOFLAG});
      for(const ch of para)out.push(ch);
    }
    para=[];
  };
  for(const ch of toChars(runs)){if(ch.c==='\n')flush();else para.push(ch)}
  flush();
  return toRuns(out);
}

/* editor <-> runs */
function runsToHtml(runs){
  let h='';
  for(const r of runs){
    let t=esc(r.t).replace(/\n/g,'<br>');
    if(r.m)t='<mark>'+t+'</mark>';
    if(r.u)t='<u>'+t+'</u>';
    if(r.i)t='<i>'+t+'</i>';
    if(r.b)t='<b>'+t+'</b>';
    h+=t;
  }
  const p=plainOf(runs);
  if(!p||p.endsWith('\n'))h+='<br>';   /* lets an empty last line show */
  return h;
}
const BLOCK_RE=/^(DIV|P|LI|UL|OL|H[1-6]|BLOCKQUOTE|PRE)$/;
function flagsOf(el,f){
  const n=el.nodeName,st=el.style||{},fw=String(st.fontWeight||'');
  const td=String(st.textDecorationLine||st.textDecoration||'');
  return{
    b:f.b||n==='B'||n==='STRONG'||fw==='bold'||Number(fw)>=600,
    i:f.i||n==='I'||n==='EM'||st.fontStyle==='italic',
    u:f.u||n==='U'||td.includes('underline'),
    m:f.m||n==='MARK'
  };
}
/* Walks the editor DOM into characters, and records where each text node and
   line break sits, so a browser selection can be turned into string offsets. */
function scanEditor(root){
  const order=[];
  (function walk(node,f){
    for(const ch of node.childNodes){
      if(ch.nodeType===3)order.push({k:'t',node:ch,f});
      else if(ch.nodeType===1){
        if(ch.nodeName==='BR')order.push({k:'br',node:ch,f});
        else{const g=flagsOf(ch,f);if(BLOCK_RE.test(ch.nodeName))order.push({k:'blk',node:ch,f:g});walk(ch,g)}
      }
    }
  })(root,NOFLAG);
  const blockOf=n=>{let p=n.parentNode;while(p&&p!==root&&!BLOCK_RE.test(p.nodeName))p=p.parentNode;return p||root};
  const chars=[];
  order.forEach((o,k)=>{
    if(o.k==='blk'){if(chars.length)chars.push({c:'\n',...NOFLAG});o.start=chars.length;o.len=0;return}
    if(o.k==='br'){
      /* a <br> with nothing after it in its block is the browser's placeholder */
      const b=blockOf(o.node);let ph=true;
      for(let j=k+1;j<order.length;j++){
        const q=order[j];
        if(!b.contains(q.node))break;
        if(q.k==='t'&&!q.node.nodeValue)continue;
        ph=false;break;
      }
      o.start=chars.length;o.len=ph?0:1;
      if(!ph)chars.push({c:'\n',...NOFLAG});
      return;
    }
    const v=o.node.nodeValue.replace(/\u00a0/g,' ');
    o.start=chars.length;o.len=v.length;
    for(let j=0;j<v.length;j++)chars.push({c:v[j],b:!!o.f.b,i:!!o.f.i,u:!!o.f.u,m:!!o.f.m});
  });
  return{order,chars};
}
function getOffsets(root){
  const sel=getSelection();
  if(!sel||!sel.rangeCount)return null;
  const r=sel.getRangeAt(0);
  if(!root.contains(r.startContainer)||!root.contains(r.endContainer))return null;
  const sc=scanEditor(root);
  const at=(node,off)=>{
    if(node.nodeType===3){const o=sc.order.find(o=>o.node===node);return o?o.start+Math.min(off,o.len):0}
    const child=node.childNodes[off];
    if(child){
      for(const o of sc.order)
        if(child.contains(o.node)||(child.compareDocumentPosition(o.node)&Node.DOCUMENT_POSITION_FOLLOWING))return o.start;
      return sc.chars.length;
    }
    let end=null;
    for(const o of sc.order)if(node.contains(o.node))end=o.start+o.len;
    if(end!==null)return end;
    for(const o of sc.order)if(node.compareDocumentPosition(o.node)&Node.DOCUMENT_POSITION_FOLLOWING)return o.start;
    return sc.chars.length;
  };
  const a=at(r.startContainer,r.startOffset),b=at(r.endContainer,r.endOffset);
  return[Math.min(a,b),Math.max(a,b)];
}
function setOffsets(root,a,b){
  const sc=scanEditor(root);
  const domAt=n=>{
    for(const o of sc.order){
      if(o.k==='t'&&n>=o.start&&n<=o.start+o.len)return[o.node,n-o.start];
      if(o.k==='br'&&n===o.start){const p=o.node.parentNode;return[p,[...p.childNodes].indexOf(o.node)]}
    }
    return[root,root.childNodes.length];
  };
  const[s1,o1]=domAt(a),[s2,o2]=domAt(b??a);
  const r=document.createRange();r.setStart(s1,o1);r.setEnd(s2,o2);
  const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
}

  document.documentElement.dataset.theme=t;
  $('#uiDark').setAttribute('aria-pressed',String(t==='dark'));
  $('#uiLight').setAttribute('aria-pressed',String(t==='light'));
  try{localStorage.setItem('poster-ui',t)}catch(e){}
}

const HL_TONES=[['main','主色'],['soft','浅色'],['accent','强调色']];
function cleanHeadLine(l){
  const n=Math.round(Number(l?.size)||0);
  return{t:String(l?.t??''),size:n?clamp(n,16,160):0,b:!!l?.b,
    font:HL_FONTS.some(([v])=>v===l?.font)?l.font:'theme',tone:HL_TONES.some(([v])=>v===l?.tone)?l.tone:'main'};
}
function headLinesFrom(o){
  if(Array.isArray(o.headLines))return o.headLines.slice(0,12).map(cleanHeadLine);
  const out=[];
  for(const t of String(o.title??'').split('\n'))if(t.trim())out.push({t,size:0,b:true,font:'theme',tone:'main'});
  if(String(o.subtitle??'').trim())out.push({t:o.subtitle,size:0,b:false,font:'theme',tone:'soft'});
  return out;
}

/* ---------------- history ---------------- */
let past=[],future=[],mark=JSON.stringify(state),commitTimer=null;
function refreshHistory(){$('#undoBtn').disabled=!past.length;$('#redoBtn').disabled=!future.length}
function commit(){
  clearTimeout(commitTimer);
  const s=JSON.stringify(state);
  if(s===mark)return;
  past.push(mark); if(past.length>40)past.shift();
  mark=s; future.length=0; refreshHistory();
}
const commitSoon=()=>{clearTimeout(commitTimer);commitTimer=setTimeout(commit,650)};
function restore(s){state=JSON.parse(s);mark=s;refreshHistory();renderControls();persist();draw();}
function undo(){commit();if(!past.length)return;future.push(mark);restore(past.pop());toast('已撤销')}
function redo(){if(!future.length)return;clearTimeout(commitTimer);past.push(mark);restore(future.pop());toast('已重做')}
$('#undoBtn').onclick=undo; $('#redoBtn').onclick=redo;
addEventListener('keydown',e=>{
  const mod=e.metaKey||e.ctrlKey; if(!mod||e.key.toLowerCase()!=='z')return;
  const t=e.target; if(t&&/^(INPUT|TEXTAREA)$/.test(t.tagName)&&!e.shiftKey)return;

let quotaHit=false;

function updateMeter(bytes){
  const fill=$('#storeFill'),note=$('#storeNote'),warn=$('#quotaWarn');
  if(!fill)return;
  const mb=bytes/1048576, pct=clamp(mb/4.5*100,1,100);
  fill.style.width=pct+'%';
  fill.dataset.level=quotaHit?'full':mb>3.2?'warn':'ok';
  note.textContent=quotaHit
    ? '浏览器存储已满，自动保存已停止 — 请用「保存工程」留存，或移除几张照片。'
    : `草稿占用 ${mb.toFixed(2)} MB / 约 4.5 MB 可用`;
  warn.hidden=!quotaHit;
}

let toastTimer=null;
function toast(msg,action){
  const el=$('#toast');
  el.innerHTML='<span id="toastMsg"></span>';
  $('#toastMsg').textContent=msg;
  if(action){
    const b=document.createElement('button');
    b.type='button'; b.textContent=action.label;
    b.onclick=()=>{el.classList.remove('on');action.run()};

  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('on'),action?6000:2600);
}

/* ---------------- image helpers ---------------- */
const cache=new Map();
function getImage(src){
  if(!src)return Promise.resolve(null);
  if(!cache.has(src))cache.set(src,new Promise(res=>{
    const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=src;
  }));
  return cache.get(src);
}
/* Photos re-encode to JPEG, which keeps the draft inside the browser's
   storage budget; a logo stays PNG so transparency survives. */
async function prepImage(file,kind){
  if(!file.type.startsWith('image/'))throw new Error('请选择图片文件');
  const raw=await new Promise((res,rej)=>{
    const r=new FileReader();r.onerror=()=>rej(new Error('图片读取失败'));r.onload=()=>res(r.result);r.readAsDataURL(file);
  });
  const im=await getImage(raw);
  if(!im)throw new Error('这张图片无法解码，请换 JPG 或 PNG');
  const alpha=kind==='logo';
  const maxW=alpha?1200:1800, maxH=alpha?600:5000;
  const scale=Math.min(1,maxW/im.width,maxH/im.height);
  if(scale===1&&alpha&&file.type==='image/png')return raw;
  const cv=document.createElement('canvas');
  cv.width=Math.max(1,Math.round(im.width*scale));
  cv.height=Math.max(1,Math.round(im.height*scale));
  const c=cv.getContext('2d');
  if(!alpha){c.fillStyle='#ffffff';c.fillRect(0,0,cv.width,cv.height)}
  c.drawImage(im,0,0,cv.width,cv.height);
  return alpha?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',0.85);
}

/* ---------------- canvas drawing ---------------- */
function font(c,size,bold){c.font=`${bold?'bold ':''}${size}px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif`}
const SANS='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
function runFont(c,size,st,face){c.font=`${st.i?'italic ':''}${st.b?'bold ':''}${size}px ${face||SANS}`}
const TOKEN_RE=/[A-Za-z0-9]+(?:[.'’_-][A-Za-z0-9]+)*%?|\s+|[^\s]/g;
const HANG_RE=/^[，。、；：！？）」』”’》〉】,.;:!?)]$/;   /* may not start a line */
const OPEN_RE=/^[（「『“‘《〈【(]$/;                     /* may not end a line */
/* Greedy wrap over styled runs: each token is measured in its own font, Latin
   words stay whole, closing punctuation hangs rather than starting a line, and
   an opening bracket moves down with the word it opens. */
function richWrap(c,runs,width,size,face){
  const lines=[];let toks=[],w=0,soft=false;
  const flush=isSoft=>{
    while(toks.length&&/^\s+$/.test(toks[toks.length-1].t))w-=toks.pop().w;
    lines.push({toks,w});toks=[];w=0;soft=isSoft;
  };
  const push=(t,st,tw)=>{toks.push({t,st,w:tw});w+=tw};
  for(const r of runs){
    const parts=r.t.split('\n');
    for(let pi=0;pi<parts.length;pi++){
      if(pi>0)flush(false);
      runFont(c,size,r,face);
      for(const tk of parts[pi].match(TOKEN_RE)||[]){
        const space=/^\s+$/.test(tk);
        if(space&&soft&&!toks.length)continue;
        const tw=c.measureText(tk).width;
        if(!space&&tw>width){
          for(const ch of tk){
            const cw=c.measureText(ch).width;
            if(toks.length&&w+cw>width)flush(true);
            push(ch,r,cw);
          }
          continue;
        }
        if(toks.length&&w+tw>width){
          if(!space&&HANG_RE.test(tk)&&tw<=size*1.2){push(tk,r,tw);continue}
          let carry=null;
          if(toks.length>1&&OPEN_RE.test(toks[toks.length-1].t)){carry=toks.pop();w-=carry.w}
          flush(true);
          if(carry)push(carry.t,carry.st,carry.w);
          if(space)continue;
        }
        push(tk,r,tw);
      }
    }
  }
  flush(false);
  return lines;
}
function lum(hex){
  const[r,g,b]=rgb(hex).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  return .2126*r+.7152*g+.0722*b;
}
function contrast(a,b){const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
/* emphasis uses the theme's accent, pulled toward the body ink until it reads on the card */
function emphColor(s){
  let col=s.accent;const toward=isDark(s.card)?'#ffffff':'#151515';
  for(let k=0;k<5&&contrast(col,s.card)<3.4;k++)col=blend(col,toward,.22);
  return col;
}

/* Greedy wrap that keeps Latin words and numbers whole and breaks CJK per
   character, so mixed Chinese/English lines no longer split mid-word. */
/* Wrap, then narrow the measure until one more step would add a line, so a
   title that has to break splits into even lines instead of leaving one or
   two characters stranded on the last line. Each typed line is balanced on its own. */
function balancedWrap(c,value,width){
  const out=[];
  for(const para of String(value??'').split('\n')){
    const first=wrap(c,para,width);
    if(first.length<2){out.push(...first);continue}
    /* two lines: break after a separator near the middle when both halves fit,
       so 「…分行·漯河郾城…」 splits at the dot rather than inside a name */
    if(first.length===2){
      const chars=[...para],n=chars.length;let best=-1,bestD=1e9;
      for(let k=1;k<n;k++){
        if(!/[·•・，,、；;：:\s|｜—]/.test(chars[k-1])||k<n*.28||k>n*.72)continue;
        const a=chars.slice(0,k).join('').trim(),b=chars.slice(k).join('').trim();
        if(!a||!b||c.measureText(a).width>width||c.measureText(b).width>width)continue;
        const d=Math.abs(c.measureText(a).width-c.measureText(b).width);
        if(d<bestD){bestD=d;best=k}
      }
      if(best>0){
        let a=chars.slice(0,best).join('').trim();const b=chars.slice(best).join('').trim();
        out.push(/[·•・|｜—]$/.test(a)?a.slice(0,-1).trim()||a:a,b);continue;
      }
    }
    let lo=width*.4,hi=width;
    for(let k=0;k<14;k++){const m=(lo+hi)/2;if(wrap(c,para,m).length>first.length)lo=m;else hi=m}
    out.push(...wrap(c,para,Math.ceil(hi)+1));
  }
  return out;
}
function wrap(c,value,width){
  const out=[];
  for(const para of String(value??'').split('\n')){
    if(!para){out.push('');continue}
    const tokens=para.match(/[A-Za-z0-9]+(?:[.'’_-][A-Za-z0-9]+)*%?|\s+|[^\s]/g)||[];
    let row='';
    for(const tk of tokens){
      const space=/^\s+$/.test(tk);
      if(!space&&c.measureText(tk).width>width){
        if(row){out.push(row.trimEnd());row=''}
        for(const ch of tk){
          if(row&&c.measureText(row+ch).width>width){out.push(row);row=''}
          row+=ch;
        }
        continue;
      }
      const next=row+tk;
      if(row&&c.measureText(next).width>width){out.push(row.trimEnd());row=space?'':tk}
      else row=next;
    }
    out.push(row.trimEnd());
  }
  return out;
}
function round(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,Math.min(r,w/2,h/2));c.fill()}
function cover(c,img,x,y,w,h){
  if(!img)return;
  const s=Math.max(w/img.width,h/img.height);
  c.save();c.beginPath();c.rect(x,y,w,h);c.clip();
  c.drawImage(img,x+(w-img.width*s)/2,y+(h-img.height*s)/2,img.width*s,img.height*s);
  c.restore();
}
function rgb(hex){const m=/^#([\da-f]{6})$/i.exec(hex||'');return m?[0,2,4].map(i=>parseInt(m[1].slice(i,i+2),16)):[24,42,81]}
function blend(a,b,t){const x=rgb(a),y=rgb(b);return '#'+x.map((n,i)=>Math.round(n*(1-t)+y[i]*t).toString(16).padStart(2,'0')).join('')}
function rgba(hex,a){return `rgba(${rgb(hex).join(',')},${a})`}
function ink(hex){const[r,g,b]=rgb(hex);return r*.2126+g*.7152+b*.0722>160?'#20303c':'#ffffff'}
function ring(c,x,y,r,color,a){c.strokeStyle=rgba(color,a??.25);c.lineWidth=2;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.stroke()}

/* "Noto Serif SC" is the bundled Source Han Serif from Google Fonts, so a serif
   looks the same on every device; the rest of the stack covers offline use */
const SERIF='"Noto Serif SC","Noto Serif CJK SC","Songti SC","STSong",SimSun,serif';
const KAI='"Kaiti SC","STKaiti","KaiTi","Songti SC",serif';
const MONO='"SF Mono",Menlo,Consolas,ui-monospace,monospace';
function serif(c,size,bold){c.font=`${bold?'bold ':''}${size}px ${SERIF}`}
function kai(c,size,bold){c.font=`${bold?'bold ':''}${size}px ${KAI}`}
function mono(c,size,bold){c.font=`${bold?'bold ':''}${size}px ${MONO}`}
const themeOf=s=>themes[s.preset]||{};
/* the display face each family sets its titles in */
function faceFor(c,f,size,bold){
  if(f==='editorial'||f==='ink')serif(c,size,bold);
  else if(f==='tradition')kai(c,size,bold);
  else font(c,size,bold);
}
const GLASS_A='#5b8def',GLASS_C='#3dddfc',BLUE_LINE='#5ba3e0';
/* titleFont: 'theme' keeps each family's own face; 'sans' / 'serif' override it */
function titleFace(c,s,size,bold){
  if(s.titleFont==='serif')serif(c,size,bold);
  else if(s.titleFont==='sans')font(c,size,bold);
  else faceFor(c,fam(s.preset),size,bold);
}
function subFace(c,s,size){
  const f=fam(s.preset);
  if(s.titleFont==='serif')serif(c,size,false);
  else if(s.titleFont==='sans')font(c,size,false);
  else f==='tradition'?kai(c,size,false):(f==='editorial'||f==='ink')?serif(c,size,false):font(c,size,false);
}
function boxFace(c,s,bm){
  if(s.titleFont==='serif')serif(c,bm.size,true);
  else if(s.titleFont==='sans')font(c,bm.size,true);
  else if(bm.kai)kai(c,bm.size,true);
  else if(bm.serif)serif(c,bm.size,true);
  else font(c,bm.size,true);
}
const bodyFaceOf=s=>s.bodyFont==='serif'?SERIF:SANS;
const usesSerif=s=>s.titleFont==='serif'||s.bodyFont==='serif'
  ||(s.headLines||[]).some(l=>l.font==='serif')
  ||(s.titleFont!=='sans'&&['editorial','ink'].includes(fam(s.preset)));
/* Canvas draws with whatever glyphs are loaded at that moment, so fetch the
   serif slices for every character on the poster first (capped at 4 s so an
   offline machine falls back to the system serif instead of waiting). */
async function ensureFonts(s){
  if(!document.fonts||!document.fonts.load||!usesSerif(s))return;
  const text=[s.org,...(s.headLines||[]).map(l=>l.t),s.footer,s.date,
    ...s.sections.flatMap(x=>[x.title,x.text])].join('')+'0123456789';
  const sample=[...new Set(text)].join('');
  try{await Promise.race([
    Promise.all(['400','700'].map(w=>document.fonts.load(`${w} 40px "Noto Serif SC"`,sample))),
    new Promise(r=>setTimeout(r,4000))])}catch(e){}
}
function isDark(hex){return ink(hex)==='#ffffff'}
function headInk(s){return ink(s.bg)}
function bodyInk(s){return ink(s.card)}
function cardR(s){return clamp(+s.radius||0,0,100)}
function photoR(s){return Math.min(cardR(s)*.5,26)}
function hair(c,color,x,y,w,a){c.fillStyle=rgba(color,a??.16);c.fillRect(x,y,w,1)}
function drawPhoto(c,im,x,y,w,h,r){
  if(r>0){c.save();c.beginPath();c.roundRect(x,y,w,h,Math.min(r,w/2,h/2));c.clip();
    c.drawImage(im,x,y,w,h);c.restore()}
  else c.drawImage(im,x,y,w,h);
}

/* One continuous ground colour; every section is a separate panel floating on
   it, and every section title is a separate box sitting on that panel's edge. */
function drawBackground(c,s,H){
  const f=fam(s.preset),head=+s.headerHeight,foot=+s.footerHeight;
  /* 1 ground */
  if(f==='glass'){
    const g=c.createLinearGradient(0,0,W*.5,H);
    g.addColorStop(0,blend(s.bg,'#2b2f86',.4));g.addColorStop(.3,s.bg);g.addColorStop(1,blend(s.bg,'#000000',.25));
    c.fillStyle=g;c.fillRect(0,0,W,H);
    const glow=(x,y,r,col,a)=>{const gg=c.createRadialGradient(x,y,0,x,y,r);
      gg.addColorStop(0,rgba(col,a));gg.addColorStop(1,rgba(col,0));c.fillStyle=gg;c.fillRect(x-r,y-r,2*r,2*r)};
    glow(W*.88,head*.12,640,s.accent,.42);glow(W*.08,head*.75,540,GLASS_A,.3);
    glow(W*.55,H-foot*.5,600,GLASS_C,.16);glow(W*.2,H*.5,760,s.accent,.1);
  } else if(f==='consult'){
    c.fillStyle=blend(s.card,'#ffffff',.65);c.fillRect(0,0,W,H);
    c.fillStyle=s.bg;c.fillRect(0,0,W,head);c.fillRect(0,H-foot,W,foot);
  } else {c.fillStyle=s.bg;c.fillRect(0,0,W,H)}
  /* 2 family ornaments that sit under the pattern */
  if(f==='blueprint'){
    c.fillStyle=rgba(BLUE_LINE,.07);for(let x=0;x<W;x+=24)c.fillRect(x,0,1,H);for(let y=0;y<H;y+=24)c.fillRect(0,y,W,1);
    c.fillStyle=rgba(BLUE_LINE,.15);for(let x=0;x<W;x+=120)c.fillRect(x,0,1,H);for(let y=0;y<H;y+=120)c.fillRect(0,y,W,1);
  }
  if(f==='swiss'){
    c.fillStyle=rgba('#1a1a1a',.13);
    for(let x=90;x<W;x+=90)c.fillRect(x,0,1,head-40);
    for(let y=90;y<head-40;y+=90)c.fillRect(0,y,W,1);
  }
  if(f==='glass'){
    const shard=(cx,cy,w,h,deg,a)=>{c.save();c.translate(cx,cy);c.rotate(deg*Math.PI/180);
      const g=c.createLinearGradient(-w/2,-h/2,w/2,h/2);g.addColorStop(0,rgba('#ffffff',a));g.addColorStop(1,rgba('#ffffff',a*.2));
      c.fillStyle=g;c.beginPath();c.roundRect(-w/2,-h/2,w,h,26);c.fill();
      c.strokeStyle=rgba('#ffffff',a*1.6);c.lineWidth=1.4;c.stroke();c.restore()};
    shard(W-120,head*.18,420,260,-18,.09);shard(W-10,head*.52,300,200,-18,.07);shard(W*.62,-30,260,170,-18,.06);
  }
  if(f==='ink'){
    const r=mulberry32(77);
    c.fillStyle=rgba('#5a5045',.05);
    for(let k=0;k<900;k++){const x=r()*W,y=r()*H;c.fillRect(x,y,1+r()*1.6,1+r()*1.6)}
    const range=(base,amp,peak,spread,seed,col,a)=>{
      const rr=mulberry32(seed),p=[rr()*6.28,rr()*6.28,rr()*6.28];
      c.beginPath();c.moveTo(-10,base+80);
      for(let x=-10;x<=W+10;x+=4){
        const env=Math.exp(-Math.pow((x-peak)/spread,2));
        const n=.55+.3*Math.sin(x/90+p[0])+.12*Math.sin(x/37+p[1])+.05*Math.sin(x/13+p[2]);
        c.lineTo(x,base-amp*env*n);
      }
      c.lineTo(W+10,base+80);c.closePath();
      const g=c.createLinearGradient(0,base-amp,0,base+80);
      g.addColorStop(0,rgba(col,a));g.addColorStop(.6,rgba(col,a*.55));g.addColorStop(1,rgba(col,0));
      c.fillStyle=g;c.fill();
    };
    const yb=head*.92;
    range(yb-60,330,W*.86,260,3,'#6b6258',.22);
    range(yb-20,420,W*.74,200,9,'#3d3630',.34);
    range(yb+10,250,W*.98,170,17,'#2a2420',.42);
    range(yb+30,150,W*.55,190,29,'#4a423a',.2);
  }
  drawPattern(c,s,H);
  if(isDark(s.bg)&&f!=='glass'&&f!=='blueprint'){
    const g=c.createRadialGradient(W*.78,260,0,W*.78,260,980);
    g.addColorStop(0,rgba(blend(s.bg,'#ffffff',.55),.09));g.addColorStop(1,rgba(s.bg,0));
    c.fillStyle=g;c.fillRect(0,0,W,Math.min(H,1500));
  }
  /* 3 signature marks that stay crisp above everything */
  if(f==='consult'){c.fillStyle=s.accent;c.fillRect(0,0,W*.64,6);c.fillStyle='#2d8a4e';c.fillRect(W*.64,0,W*.36,6)}
  if(f==='tradition'){
    const t=themeOf(s);
    const mg=c.createRadialGradient(W-200,170,0,W-200,170,150);
    mg.addColorStop(0,rgba(t.hl2||s.accent,.16));mg.addColorStop(1,rgba(t.hl2||s.accent,0));
    c.fillStyle=mg;c.beginPath();c.arc(W-200,170,150,0,Math.PI*2);c.fill();
    c.fillStyle=rgba(t.hl||s.accent,.7);c.fillRect(96,H-foot+18,W-192,1);c.fillRect(96,H-foot+24,W-192,1);
  }
}

/* Statement backgrounds: large-scale, clearly visible motifs that live in the
   header corners, along the header's lower edge and in the footer. A soft halo
   of the ground colour sits behind the title block, so the edges carry the
   impact while the centre stays quiet. */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function patTone(s){return isDark(s.bg)?blend(s.bg,'#ffffff',.92):blend(s.bg,'#000000',.62)}
function patHi(s){return isDark(s.bg)?blend(s.accent,'#ffffff',.45):blend(s.accent,'#000000',.1)}
function patFade(s,H,dip,tailTop,tailBot){
  const head=+s.headerHeight,foot=+s.footerHeight;
  return y=>{
    if(y<=head||y>=H-foot)return 1;
    const top=clamp(1-(y-head)/tailTop,0,1),bot=clamp(1-((H-foot)-y)/tailBot,0,1);
    const t=Math.max(top,bot);return dip+(1-dip)*t*t*(3-2*t);
  };
}
/* the calm zone behind the title */
function titleHalo(c,s,strength){
  const head=+s.headerHeight,al=s.headAlign||'center';
  const cx=al==='center'?W/2:al==='right'?W-430:430,cy=head*.6;
  c.save();c.translate(cx,cy);c.scale(1.7,1);
  const g=c.createRadialGradient(0,0,0,0,0,330);
  g.addColorStop(0,rgba(s.bg,.82*strength));g.addColorStop(.6,rgba(s.bg,.5*strength));g.addColorStop(1,rgba(s.bg,0));
  c.fillStyle=g;c.fillRect(-W,-head,2*W,2*head);c.restore();
}
function ridgePath(c,base,amp,seed,x0,x1,step){
  const r=mulberry32(seed),p=[r()*6.28,r()*6.28,r()*6.28,r()*6.28];
  for(let x=x0;x<=x1;x+=step){
    const n=Math.sin(x/330+p[0])*.55+Math.sin(x/150+p[1])*.27+Math.sin(x/64+p[2])*.13+Math.sin(x/25+p[3])*.05;
    c.lineTo(x,base-amp*(.5+.5*n));
  }
}

const patterns={
  none:{name:'无图案',desc:'纯色背景',a:[0,0],halo:0,draw(){}},

  /* 1 青海波 — big wave fans across the whole header, a band in the footer */
  waves:{name:'青海波',desc:'大尺度水波 · 铺满页头',a:[.26,.2],halo:1,draw(c,s,H,o){
    const R=78,step=R*.5,head=+s.headerHeight,foot=+s.footerHeight,f=patFade(s,H,0,420,360);

        const a=o.A*f(y),off=(row&1)?R:0;
        for(let x=-2*R+off;x<W+2*R;x+=2*R){

  /* 3 流光 — a wide ribbon of fine lines sweeping across the header */
  flow:{name:'流光',desc:'丝带流线 · 动感',a:[.55,.45],halo:.75,draw(c,s,H,o){

  /* 5 网点球 — giant halftone spheres bleeding off two corners */
  halftone:{name:'网点球',desc:'大网点 · 平面感',a:[.42,.34],halo:.8,draw(c,s,H,o){
    const foot=+s.footerHeight;
    const sphere=(cx,cy,R,step,maxR,col)=>{

      for(let y=cy-R;y<=cy+R;y+=step)for(let x=cx-R;x<=cx+R;x+=step){
        if(x<-10||x>W+10||y<-10||y>H+10)continue;
        const d=Math.hypot(x-cx,y-cy)/R;if(d>=1)continue;
        const rr=maxR*Math.pow(1-d,1.15);if(rr<.5)continue;
        c.moveTo(x+rr,y);c.arc(x,y,rr,0,Math.PI*2);
      }
      c.fill();
    };
    sphere(W-40,70,620,22,8.5,o.hi);
    if(o.foot)sphere(60,H-40,460,22,7.5,o.tone);
  }},

  /* 6 块面 — overlapping translucent planes, cut at an angle */
  planes:{name:'几何块面',desc:'斜切色块 · 现代',a:[.27,.21],halo:.9,draw(c,s,H,o){
    const head=+s.headerHeight,foot=+s.footerHeight;
    const quad=(pts,col,a,stroke)=>{c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();
      if(stroke){c.strokeStyle=rgba(col,a);c.lineWidth=2;c.stroke()}else{c.fillStyle=rgba(col,a);c.fill()}};
    const rot=(cx,cy,w,h,deg)=>{const t=deg*Math.PI/180,cs=Math.cos(t),sn=Math.sin(t);
      return[[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]].map(([x,y])=>[cx+x*cs-y*sn,cy+x*sn+y*cs])};
    quad(rot(W-40,head*.1,620,620,32),o.hi,o.A*1.1);
    quad(rot(W+80,head*.55,520,520,32),o.tone,o.A*.8);
    quad(rot(W-260,-60,300,300,32),o.tone,o.A*.6);
    quad(rot(W-150,head*.35,760,760,32),o.tone,o.A*1.2,true);
    quad(rot(-60,head*.9,360,360,32),o.hi,o.A*.7);
    quad(rot(-120,head*.6,520,520,32),o.tone,o.A,true);
    if(o.foot){
      quad(rot(-40,H-foot*.3,520,520,32),o.hi,o.A*.9);
      quad(rot(W+40,H+40,560,560,32),o.tone,o.A*.8);
      quad(rot(W-120,H-foot*.5,700,700,32),o.tone,o.A*1.1,true);
    }
  }},

  /* 7 回纹 — a heavy key-fret frame: bands across top and foot, strips down both sides */
  fret:{name:'回纹框',desc:'粗回纹 · 通栏边框',a:[.34,.28],halo:.6,draw(c,s,H,o){
    const g=geometry(s.preset),head=+s.headerHeight,foot=+s.footerHeight;
    const P=[[0,0],[1,0],[1,1],[.2,1],[.2,.2],[.8,.2],[.8,.8],[.4,.8],[.4,.4],[.6,.4],[.6,.6]];
    const cell=(x0,y0,u,flipX,flipY)=>{
      const pt=([px,py])=>[x0+(flipX?1-px:px)*u,y0+(flipY?1-py:py)*u];
      const[sx,sy]=pt(P[0]);c.moveTo(sx,sy);for(let k=1;k<P.length;k++){const[x,y]=pt(P[k]);c.lineTo(x,y)}
    };
    c.lineJoin='miter';c.lineCap='butt';
    /* horizontal bands */
    const band=(y,u,col,a)=>{
      c.strokeStyle=rgba(col,a);c.lineWidth=Math.max(2.4,u*.085);c.beginPath();
      const n=Math.floor((W-40)/(u*1.25)),startX=(W-n*u*1.25+u*.25)/2;
      for(let i=0;i<n;i++)cell(startX+i*u*1.25,y,u,i&1,0);
      c.moveTo(startX-14,y+u+12);c.lineTo(W-startX+14,y+u+12);
      c.moveTo(startX-14,y-12);c.lineTo(W-startX+14,y-12);
      c.stroke();
    };
    band(40,40,o.hi,o.A);
    if(o.foot)band(H-foot+28,34,o.hi,o.A*.9);
    /* side strips through the header, easing out down the page */
    const u=34,m=Math.max(8,Math.round((g.x-u)/2)),f=patFade(s,H,.35,900,600);
    for(const side of[0,1]){
      const x0=side?W-m-u:m;
      for(let y=120;y<H-foot-u;y+=u+10){
        c.strokeStyle=rgba(o.tone,o.A*.8*f(y));c.lineWidth=2.6;c.beginPath();cell(x0,y,u,side,0);
        c.moveTo(side?x0+u:x0,y);c.lineTo(side?x0+u:x0,y+u+10);c.stroke();
      }
    }
  }},

  /* 8 祥云 — big auspicious clouds drifting in from the header corners */
  clouds:{name:'祥云',desc:'大朵云纹 · 吉庆',a:[.3,.24],halo:.85,draw(c,s,H,o){
    const head=+s.headerHeight,foot=+s.footerHeight;
    const cloud=(cx,cy,k,flip,a)=>{
      const lobes=[[0,0,1],[1.15,-.42,.82],[2.15,-.05,.92],[-1.05,.22,.72],[.95,.5,.78],[2.9,.45,.6]];
      const L=lobes.map(([x,y,r])=>[cx+(flip?-x:x)*70*k,cy+y*70*k,r*70*k]);
      c.fillStyle=rgba(o.tone,a*.55);c.beginPath();
      for(const[x,y,r]of L){c.moveTo(x+r,y);c.arc(x,y,r,0,Math.PI*2)}
      c.fill();
      c.strokeStyle=rgba(o.hi,a*1.25);c.lineCap='round';
      for(const[x,y,r]of L.slice(0,4)){
        c.lineWidth=Math.max(2.5,r*.07);c.beginPath();
        const a0=flip?0:Math.PI;
        for(let i=0;i<=40;i++){const t=i/40,ang=a0+(flip?-1:1)*t*Math.PI*2.3,rad=r*(.78-.6*t);
          const px=x+Math.cos(ang)*rad,py=y+Math.sin(ang)*rad;i?c.lineTo(px,py):c.moveTo(px,py)}
        c.stroke();
      }
      /* tail */
      c.lineWidth=Math.max(2.5,6*k);c.beginPath();
      const tx=L[3][0],ty=L[3][1]+L[3][2]*.6;c.moveTo(tx,ty);
      c.bezierCurveTo(tx+(flip?60:-60)*k,ty+40*k,tx+(flip?150:-150)*k,ty-10*k,tx+(flip?210:-210)*k,ty+30*k);c.stroke();
    };
    cloud(W-250,120,1.6,true,o.A);
    cloud(150,head*.82,1.15,false,o.A*.85);
    cloud(W-170,head*.92,.9,true,o.A*.7);
    if(o.foot){cloud(170,H-foot*.55,1.2,false,o.A*.85);cloud(W-160,H-foot*.25,1,true,o.A*.75)}
  }}
};

/* one pattern colour per poster: the theme's own tones, gold, the title-box
   colour, or a colour the user picks */
/* Nine modern geometric backgrounds. Same contract as the built-in set:
   draw(c,s,H,o) with o = {tone, hi, A, foot}; everything sits in the header
   corners and the footer, and the title halo calms the centre. */
Object.assign(patterns,{

  /* 斜向网点 — a halftone gradient falling away from the top-right corner */
  dotfield:{name:'斜向网点',desc:'网点渐变 · 平面',a:[.42,.34],halo:.85,draw(c,s,H,o){
    const head=+s.headerHeight,foot=+s.footerHeight,step=24,maxR=8.5;
    const field=(x0,y0,x1,y1,val,col)=>{
      c.fillStyle=rgba(col,o.A);c.beginPath();
      for(let y=y0;y<y1;y+=step)for(let x=x0+((y/step|0)&1)*step/2;x<x1;x+=step){
        const v=val(x,y);if(v<=.04)continue;
        const r=maxR*Math.min(1,v);c.moveTo(x+r,y);c.arc(x,y,r,0,Math.PI*2);
      }
      c.fill();
    };
    field(0,0,W,head+60,(x,y)=>(x/W)*1.15+(1-y/head)*.9-1.05,o.hi);
    if(o.foot)field(0,H-foot-80,W,H,(x,y)=>(1-x/W)*1.1+((y-(H-foot-80))/(foot+80))*.9-1.05,o.tone);
  }},

  /* 同心圆环 — bold rings of alternating weight, cut by two corners */
  rings:{name:'同心圆环',desc:'粗细交替 · 张力',a:[.24,.2],halo:.85,draw(c,s,H,o){
    const set=(cx,cy,r0,r1,step)=>{
      let k=0;
      for(let r=r0;r<r1;r+=step,k++){
        c.strokeStyle=rgba(k%2?o.tone:o.hi,o.A*(k%2?.8:1.1));
        c.lineWidth=k%2?2.5:12;c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.stroke();
      }
    };
    set(W+40,-30,90,820,48);
    if(o.foot)set(-50,H+40,70,560,44);
  }},

  /* 包豪斯 — flat quarter circles, half circles, a triangle and bars */
  bauhaus:{name:'包豪斯',desc:'几何拼贴 · 设计感',a:[.34,.26],halo:.9,draw(c,s,H,o){
    const head=+s.headerHeight,foot=+s.footerHeight;
    const fill=(col,a)=>{c.fillStyle=rgba(col,o.A*a);c.fill()};
    c.beginPath();c.moveTo(W,0);c.arc(W,0,330,Math.PI/2,Math.PI);c.closePath();fill(o.hi,1);
    c.beginPath();c.arc(W-410,0,130,0,Math.PI);fill(o.tone,.85);
    c.beginPath();c.arc(W-150,head*.62,62,0,Math.PI*2);fill(o.tone,.9);
    c.beginPath();c.moveTo(W-300,head*.48);c.lineTo(W-200,head*.78);c.lineTo(W-400,head*.78);c.closePath();fill(o.hi,.7);
    c.save();c.translate(W-520,head*.22);c.rotate(-Math.PI/7);c.fillStyle=rgba(o.tone,o.A*.7);c.fillRect(-90,-11,180,22);c.restore();
    c.beginPath();c.arc(0,head*.8,150,-Math.PI/2,Math.PI/2);fill(o.tone,.75);
    c.beginPath();c.arc(70,head*.8,18,0,Math.PI*2);fill(o.hi,1);
    if(o.foot){
      c.beginPath();c.moveTo(0,H);c.arc(0,H,260,-Math.PI/2,0);c.closePath();fill(o.hi,.9);
      c.beginPath();c.arc(330,H,90,Math.PI,Math.PI*2);fill(o.tone,.8);
      c.beginPath();c.arc(W-120,H-foot*.55,44,0,Math.PI*2);fill(o.tone,.8);
    }
  }},

  /* 斜纹带 — racing stripes filling a wedge at the corner */
  stripes:{name:'斜纹带',desc:'斜向条纹 · 动感',a:[.22,.18],halo:.85,draw(c,s,H,o){
    const head=+s.headerHeight,foot=+s.footerHeight;
    const wedge=(pts,flip)=>{
      c.save();c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.clip();
      const span=W+H;c.lineWidth=20;
      for(let k=-span,i=0;k<span;k+=40,i++){
        c.strokeStyle=rgba(i%3===0?o.hi:o.tone,o.A*(i%3===0?1.3:1));
        c.beginPath();
        if(flip){c.moveTo(k,H);c.lineTo(k+H,0)}else{c.moveTo(k,0);c.lineTo(k+H,H)}
        c.stroke();
      }
      c.restore();
    };
    wedge([[W*.46,0],[W,0],[W,head*.88]],false);
    wedge([[0,head*.55],[0,head*1.05],[W*.2,head*1.05]],false);
    if(o.foot)wedge([[0,H-foot*1.25],[0,H],[W*.55,H]],true);
  }},

  /* 像素方块 — a mosaic that dissolves away from the corner */
  pixels:{name:'像素方块',desc:'马赛克溶解 · 数字感',a:[.36,.28],halo:.85,draw(c,s,H,o){
    const head=+s.headerHeight,foot=+s.footerHeight,cell=36,r=mulberry32(21);
    const field=(cx,cy,reach,y0,y1)=>{
      for(let y=y0;y<y1;y+=cell)for(let x=0;x<W;x+=cell){
        const d=Math.hypot(x+cell/2-cx,y+cell/2-cy)/reach,p=1-d;
        const roll=r();if(p<=0||roll>p*1.05)continue;
        const big=roll<p*.55,sz=big?cell-4:cell*.46,off=(cell-sz)/2;
        c.fillStyle=rgba(r()<.32?o.hi:o.tone,o.A*(.45+.55*p));
        c.fillRect(x+off,y+off,sz,sz);
      }
    };
    field(W,0,620,0,head+80);
    if(o.foot)field(0,H,520,H-foot-120,H);
  }},

  /* 加号阵列 — a Swiss grid of plus marks, a few picked out in the accent */
  plus:{name:'加号阵列',desc:'十字网格 · 秩序感',a:[.38,.3],halo:.9,draw(c,s,H,o){
    const head=+s.headerHeight,foot=+s.footerHeight,step=58,r=mulberry32(8);
    c.lineCap='round';
    const grid=(y0,y1,val)=>{
      for(let y=y0;y<y1;y+=step)for(let x=step/2;x<W;x+=step){
        const v=val(x,y);if(v<=.05)continue;
        const hot=r()<.08,sz=hot?13:8;
        c.strokeStyle=rgba(hot?o.hi:o.tone,o.A*Math.min(1,v)*(hot?1.4:1));c.lineWidth=hot?3.6:2.4;
        c.beginPath();c.moveTo(x-sz,y);c.lineTo(x+sz,y);c.moveTo(x,y-sz);c.lineTo(x,y+sz);c.stroke();
      }
    };
    grid(step/2,head+40,(x,y)=>.25+.9*(x/W)*(1-y/(head+40))+.35*(1-y/(head+40)));
    if(o.foot)grid(H-foot-60,H,(x,y)=>.2+.8*((y-(H-foot-60))/(foot+60)));
  }},

  /* 节点网络 — scattered nodes joined by fine links, like a constellation */
  network:{name:'节点网络',desc:'连线星图 · 科技',a:[.42,.34],halo:.85,draw(c,s,H,o){
    const head=+s.headerHeight,foot=+s.footerHeight;
    const web=(n,cx,cy,rx,ry,seed)=>{
      const r=mulberry32(seed),pts=[];
      for(let k=0;k<n;k++){const a=r()*Math.PI*2,d=Math.sqrt(r());pts.push([cx+Math.cos(a)*rx*d,cy+Math.sin(a)*ry*d,r()])}
      c.lineWidth=1.8;
      for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
        const[x1,y1]=pts[i],[x2,y2]=pts[j],dd=Math.hypot(x2-x1,y2-y1);
        if(dd>190)continue;
        c.strokeStyle=rgba(o.tone,o.A*1.05*(1-dd/190));c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();
      }
      for(const[x,y,w]of pts){
        const big=w>.82;
        c.fillStyle=rgba(big?o.hi:o.tone,o.A*(big?1.3:1));
        c.beginPath();c.arc(x,y,big?9:4.2,0,Math.PI*2);c.fill();
        if(big){c.strokeStyle=rgba(o.hi,o.A);c.lineWidth=2;c.beginPath();c.arc(x,y,19,0,Math.PI*2);c.stroke()}
      }
    };
    web(46,W-120,head*.3,520,head*.55,4);
    web(14,90,head*.85,220,140,9);
    if(o.foot)web(26,W*.3,H-foot*.4,460,foot*.6,13);
  }},

  /* 彩虹弧 — thick nested arcs rising from the header's lower left */
  arcs:{name:'彩虹弧',desc:'叠层弧线 · 活泼',a:[.3,.24],halo:.85,draw(c,s,H,o){
    const head=+s.headerHeight,foot=+s.footerHeight;
    const rainbow=(cx,cy,r0,n,a0,a1)=>{
      for(let k=0;k<n;k++){
        c.strokeStyle=rgba(k%2?o.tone:o.hi,o.A*(1-k*.09));c.lineWidth=24;
        c.beginPath();c.arc(cx,cy,r0+k*40,a0,a1);c.stroke();
      }
    };
    rainbow(-20,head+30,110,7,-Math.PI/2,0);
    rainbow(W+20,-20,90,5,Math.PI/2,Math.PI);
    if(o.foot)rainbow(W+20,H+20,90,6,Math.PI,Math.PI*1.5);
  }},

  /* 孟菲斯 — squiggles, triangles, rings and dot clusters, scattered */
  memphis:{name:'孟菲斯',desc:'波浪碎片 · 活力',a:[.42,.34],halo:.9,draw(c,s,H,o){
    const head=+s.headerHeight,foot=+s.footerHeight;
    c.lineCap='round';c.lineJoin='round';
    const squiggle=(x,y,len,amp,rot,col,w)=>{c.save();c.translate(x,y);c.rotate(rot);c.strokeStyle=rgba(col,o.A);c.lineWidth=w;c.beginPath();
      for(let t=0;t<=len;t+=4){const yy=Math.sin(t/len*Math.PI*4)*amp;t?c.lineTo(t-len/2,yy):c.moveTo(-len/2,yy)}c.stroke();c.restore()};
    const zig=(x,y,len,rot,col)=>{c.save();c.translate(x,y);c.rotate(rot);c.strokeStyle=rgba(col,o.A);c.lineWidth=6;c.beginPath();
      for(let i=0;i<=6;i++){const xx=-len/2+i*len/6,yy=i%2?-14:14;i?c.lineTo(xx,yy):c.moveTo(xx,yy)}c.stroke();c.restore()};
    const tri=(x,y,sz,rot,col,stroke)=>{c.save();c.translate(x,y);c.rotate(rot);c.beginPath();c.moveTo(0,-sz);c.lineTo(sz*.9,sz*.6);c.lineTo(-sz*.9,sz*.6);c.closePath();
      if(stroke){c.strokeStyle=rgba(col,o.A);c.lineWidth=5;c.stroke()}else{c.fillStyle=rgba(col,o.A);c.fill()}c.restore()};
    const ring=(x,y,r,col)=>{c.strokeStyle=rgba(col,o.A);c.lineWidth=6;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.stroke()};
    const dots=(x,y,col)=>{c.fillStyle=rgba(col,o.A);for(let i=0;i<4;i++)for(let j=0;j<4;j++){c.beginPath();c.arc(x+i*20,y+j*20,4,0,Math.PI*2);c.fill()}};
    squiggle(W-260,96,300,22,-.25,o.hi,10);
    tri(W-96,head*.4,60,.4,o.tone,false);
    ring(W-360,head*.52,44,o.hi);
    dots(W-250,head*.62,o.tone);
    zig(W-560,76,210,.15,o.tone);
    tri(W-640,head*.36,34,-.8,o.hi,true);
    c.fillStyle=rgba(o.hi,o.A*.9);c.beginPath();c.arc(W-70,head*.86,26,0,Math.PI*2);c.fill();
    tri(130,head*.68,50,-.5,o.hi,true);
    squiggle(140,head*.94,230,16,.3,o.tone,9);
    ring(70,head*.42,26,o.tone);
    dots(40,head*.12,o.hi);
    if(o.foot){
      squiggle(W*.28,H-foot*.42,320,20,.15,o.hi,10);
      tri(W-150,H-foot*.55,52,-.3,o.tone,false);
      dots(W-340,H-foot*.72,o.hi);
      ring(90,H-foot*.72,34,o.tone);
      zig(W*.62,H-foot*.2,180,-.1,o.tone);
    }
  }}
});

/* picker groups */
const PATTERN_GROUPS=[
  ['传统纹样',['waves','ridges','fret','clouds']],
  ['现代几何',['halftone','planes','dotfield','rings','bauhaus','stripes','pixels','plus','arcs','memphis']],
  ['光影科技',['flow','bokeh','network']]
];
const PCOLOR_MODES=[['theme','跟随主题'],['gold','金色'],['accent','标题块色'],['custom','自定义']];
function patColors(s){
  const dark=isDark(s.bg),mode=s.patternColor||'theme';
  if(mode==='gold'){const g=dark?'#e3bc6a':'#b3843a';return{hi:g,tone:blend(g,s.bg,dark?.3:.2)}}
  if(mode==='accent'){const a=dark?blend(s.accent,'#ffffff',.2):s.accent;return{hi:a,tone:blend(a,s.bg,.28)}}
  if(mode==='custom'&&/^#[0-9a-f]{6}$/i.test(s.patternCustom||'')){const c=s.patternCustom;return{hi:c,tone:blend(c,s.bg,.28)}}
  return{hi:patHi(s),tone:patTone(s)};
}
function drawPattern(c,s,H){
  const p=patterns[s.pattern];
  if(!p||s.pattern==='none')return;
  const dark=isDark(s.bg),k=clamp(Number(s.patternStrength??100),20,200)/100;
  const col=patColors(s);
  c.save();
  p.draw(c,s,H,{tone:col.tone,hi:col.hi,A:(dark?p.a[0]:p.a[1])*k,foot:s.patternFoot!==false});
  if(p.halo&&(s.headLines||[]).some(l=>l.t.trim())&&s.patternHalo!==false)titleHalo(c,s,p.halo);
  c.restore();
}

function geometry(id){
  const f=fam(id);
  if(f==='editorial')return{x:150,w:834,bodyX:198,inner:738,titleWidth:680,padBottom:52,numGutter:66};
  if(f==='institutional')return{x:72,w:936,bodyX:120,inner:840,titleWidth:720,padBottom:50,numGutter:0};
  if(f==='ink')return{x:96,w:888,bodyX:140,inner:800,titleWidth:700,padBottom:54,numGutter:0};
  if(f==='tradition')return{x:88,w:904,bodyX:134,inner:812,titleWidth:700,padBottom:52,numGutter:0};
  if(f==='glass')return{x:64,w:952,bodyX:110,inner:860,titleWidth:740,padBottom:50,numGutter:0};
  if(f==='swiss'||f==='consult'||f==='blueprint')return{x:72,w:936,bodyX:114,inner:852,titleWidth:740,padBottom:48,numGutter:0};
  return{x:84,w:912,bodyX:128,inner:824,titleWidth:700,padBottom:48,numGutter:0};
}
/* the standalone title box */
function boxMetrics(f){
  if(f==='editorial')return{size:34,line:47,padX:38,padY:23,centered:false,serif:true};
  if(f==='institutional')return{size:33,line:46,padX:46,padY:24,centered:true,serif:false};
  if(f==='ink')return{size:34,line:46,padX:30,padY:20,centered:false,serif:true};
  if(f==='tradition')return{size:35,line:47,padX:32,padY:20,centered:false,kai:true};
  if(f==='swiss')return{size:32,line:44,padX:28,padY:20,centered:false};

  if(f==='glass')return{size:32,line:44,padX:34,padY:21,centered:false};

const centeredHead=f=>f==='institutional';

/* Per-family header settings: title size and leading, subtitle size, whether a
   short rule sits above the title, and how the status line is shown. */
const HEAD={
  minimal:{t:72,tl:92,ss:36,rule:[52,4]},
  editorial:{t:78,tl:98,ss:38},
  institutional:{t:66,tl:88,ss:36,rule:[72,5]},
  swiss:{t:84,tl:96,ss:34},
  consult:{t:66,tl:84,ss:34},
  ink:{t:92,tl:110,ss:36},
  tradition:{t:80,tl:100,ss:34,rule:[60,2]},
  glass:{t:74,tl:92,ss:34},
  blueprint:{t:70,tl:86,ss:32}

/* 'auto' turns the mark white on a dark ground; a header photo keeps it as is */
function logoTone(s){
  const t=s.logoTone||'auto';
  if(t!=='auto')return t;
  const photo=s.headerImage||(s.backgroundMode==='full'&&s.background);
  return !photo&&isDark(s.bg)?'white':'color';
}
const whiteCache=new WeakMap();
function whiteLogo(img){
  if(whiteCache.has(img))return whiteCache.get(img);
  const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;
  const x=cv.getContext('2d');x.drawImage(img,0,0);
  x.globalCompositeOperation='source-in';x.fillStyle='#ffffff';x.fillRect(0,0,cv.width,cv.height);
  whiteCache.set(img,cv);return cv;
}
function lineFace(c,s,l,size,k=0){
  const b=!!l.b;
  if(l.font==='sans')font(c,size,b);
  else if(l.font==='serif')serif(c,size,b);
  else if(l.font==='kai')kai(c,size,b);
  else if(isTitleRole(k)||b)titleFace(c,s,size,b);
  else subFace(c,s,size);
}
/* the accent as a header colour, nudged until it reads on the ground */
function headAccent(s){
  let col=s.accent;const toward=isDark(s.bg)?'#ffffff':'#151515';
  for(let k=0;k<8&&contrast(col,s.bg)<4.5;k++)col=blend(col,toward,.2);
  return col;
}
/* Where the logo sits and how tall the text block is, worked out before
   anything is drawn, so the header can be sized to fit (headerAuto). */
function logoRect(s,logo){
  if(!logo)return null;
  /* base fit is 420×74; logoScale enlarges or shrinks it, logoX slides it
     from the left margin (0) to the right margin (100) */
  const k=clamp(Number(s.logoScale)||100,40,250)/100,tone=logoTone(s);
  let sc=Math.min(420/logo.width,74/logo.height)*k;
  const plateK=tone==='plate'?.3:0;
  sc=Math.min(sc,(W-192)/(logo.width+logo.height*plateK*2));
  const lw=logo.width*sc,lh=logo.height*sc,px=Math.round(lh*plateK),py=Math.round(lh*plateK*.8);
  const lx=96+px+(W-192-2*px-lw)*clamp(Number(s.logoX)||0,0,100)/100,ly=70+py;
  return{lx,ly,lw,lh,px,py,tone,bottom:ly+lh+py};
}
/* theme sizes: the first line takes the theme's title size, the rest its
   subtitle size, until the user types a size of their own (size 0 = theme) */
const isTitleRole=k=>k===0;
function themeLineSize(s,k){const cfg=HEAD[fam(s.preset)]||HEAD.minimal;return isTitleRole(k)?cfg.t:cfg.ss}
function headPlan(c,s,logo){
  const f=fam(s.preset),cfg=HEAD[f]||HEAD.minimal;
  const lr=logoRect(s,logo);
  const topUsed=lr?lr.bottom:(s.org?132:0);
  const lines=(s.headLines||[]).filter(l=>String(l.t).trim());
  const maxW=880;
  const blocks=lines.map((l,k)=>{
    const want=clamp(+l.size||themeLineSize(s,k),16,160),min=Math.round(want*.7);
    let size=want;lineFace(c,s,l,size,k);
    while(size>min&&c.measureText(l.t).width>maxW){size-=2;lineFace(c,s,l,size,k)}
    const lh=isTitleRole(k)?Math.round(cfg.tl*size/cfg.t):size+18;
    return{l,k,size,rows:balancedWrap(c,l.t,maxW),lh};
  });
  const gapOf=k=>k?clamp(Math.round(Math.min(blocks[k-1].size,blocks[k].size)*.5),14,40):0;
  const ruleH=cfg.rule&&blocks.length?38:0;
  const groupH=ruleH+blocks.reduce((n,bk,k)=>n+gapOf(k)+bk.rows.length*bk.lh,0);
  return{lr,topUsed,blocks,gapOf,ruleH,groupH};

/* the header height that fits the logo and the text block with even air */
function autoHeaderHeight(c,s,logo){
  const p=headPlan(c,s,logo);
  return clamp(Math.round(p.topUsed+(p.blocks.length?80+p.groupH:0)+104),360,1600);
}
let lastAutoHead=0;
const headerIsAuto=s=>s.headerAuto!==false&&!(s.backgroundMode!=='full'&&s.headerImage);
function drawHead(c,s,logo){
  const f=fam(s.preset),col=headInk(s),head=+s.headerHeight,cfg=HEAD[f]||HEAD.minimal,th=themeOf(s);
  const plan=headPlan(c,s,logo),lr=plan.lr;
  if(lr){
    if(lr.tone==='plate'){
      c.save();c.shadowColor='rgba(0,0,0,.14)';c.shadowBlur=18;c.shadowOffsetY=4;
      c.fillStyle='#ffffff';round(c,lr.lx-lr.px,lr.ly-lr.py,lr.lw+2*lr.px,lr.lh+2*lr.py,Math.min(16,(lr.lh+2*lr.py)/2));c.restore();
    }
    c.drawImage(lr.tone==='white'?whiteLogo(logo):logo,lr.lx,lr.ly,lr.lw,lr.lh);
  }
  /* org label, styled to the family */
  if(!logo&&s.org){
    c.textAlign='left';
    const org=wrap((font(c,26,false),c),s.org,780)[0]||'';
    if(f==='blueprint'){mono(c,22,false);c.fillStyle=rgba(BLUE_LINE,.95);c.fillText('DRAWING NO. 2026 · '+org,96,112);
      c.fillStyle=rgba(s.accent,.9);c.fillRect(96,128,48,2)}
    else if(f==='tradition'){c.fillStyle=rgba(th.hl||s.accent,.9);c.fillRect(96,104,56,1.5);
      kai(c,27,false);c.fillStyle=rgba(col,.72);c.fillText(org,166,113)}
    else if(f==='swiss'){font(c,22,true);c.fillStyle=rgba(col,.8);c.fillText(org,96,112);c.fillStyle=rgba(col,.8);c.fillRect(96,124,150,1.5)}
    else{c.fillStyle=rgba(col,.62);f==='editorial'||f==='ink'?serif(c,27,false):font(c,26,false);c.fillText(org,96,116)}
  }
  /* the header lines, sitting just above the bottom of the header */
  const{blocks,gapOf,ruleH,groupH,topUsed}=plan;
  if(!blocks.length)return;
  const al=['left','center','right'].includes(s.headAlign)?s.headAlign:'center';
  const tx=al==='center'?W/2:al==='right'?W-96:96;
  let y=Math.max(topUsed+72,head-96-groupH);
  if(ruleH){
    const[rw,rh]=cfg.rule;
    c.fillStyle=f==='tradition'?(th.hl||s.accent):s.accent;
    c.fillRect(al==='center'?(W-rw)/2:al==='right'?W-96-rw:96,y,rw,rh);y+=ruleH;
  }
  c.textAlign=al;
  const accent=headAccent(s);
  blocks.forEach((bk,k)=>{
    y+=gapOf(k);
    lineFace(c,s,bk.l,bk.size,bk.k);
    for(const row of bk.rows){
      const tone=bk.l.tone;
      if(tone==='accent')c.fillStyle=accent;
      else if(tone==='soft')c.fillStyle=f==='blueprint'?BLUE_LINE:rgba(col,.7);
      else if(f==='glass'){
        const w=c.measureText(row).width,x0=al==='center'?tx-w/2:al==='right'?tx-w:tx;
        const g=c.createLinearGradient(x0,0,x0+w,0);
        g.addColorStop(0,blend(GLASS_A,'#ffffff',.25));g.addColorStop(1,blend(s.accent,'#ffffff',.2));c.fillStyle=g;
      } else c.fillStyle=col;
      c.fillText(row,tx,y+bk.size*.8);y+=bk.lh;
    }

}

function drawFrame(c,s,l){
  const f=fam(s.preset),at=l.y,r=cardR(s),bm=l.bm,th=themeOf(s);
  const outline=(col,a,w)=>{c.strokeStyle=rgba(col,a);c.lineWidth=w;c.beginPath();
    c.roundRect(l.x+w/2,at+w/2,l.w-w,l.height-w,Math.max(0,r-w/2));c.stroke()};
  /* the panel */
  if(f==='glass'){
    const g=c.createLinearGradient(0,at,0,at+l.height);
    g.addColorStop(0,rgba(blend(s.card,'#ffffff',.12),.72));g.addColorStop(1,rgba(s.card,.5));
    c.fillStyle=g;round(c,l.x,at,l.w,l.height,r);

    c.strokeStyle=rgba('#ffffff',.5);c.lineWidth=1.5;c.beginPath();c.moveTo(l.x+r,at+1);c.lineTo(l.x+l.w*.6,at+1);c.stroke();
  } else if(f==='blueprint'){

    outline(BLUE_LINE,.7,1.5);
    c.strokeStyle=s.accent;c.lineWidth=2;const k=18;
    for(const[cx,cy,dx,dy]of[[l.x,at,1,1],[l.x+l.w,at,-1,1],[l.x,at+l.height,1,-1],[l.x+l.w,at+l.height,-1,-1]]){
      c.beginPath();c.moveTo(cx-dx*8,cy+dy*k);c.lineTo(cx-dx*8,cy-dy*8);c.lineTo(cx+dx*k,cy-dy*8);c.stroke()}

    const numLeft=l.titles.length&&s.chapAlign==='right';

    c.fillText('§ '+String(l.index+1).padStart(2,'0'),numLeft?l.x+24:l.x+l.w-24,at+40);c.textAlign='left';
  } else {
    c.fillStyle=s.card;round(c,l.x,at,l.w,l.height,r);
    if(f==='minimal')outline(bodyInk(s),.14,1);
    if(f==='swiss')outline('#1a1a1a',.16,1.2);
    if(f==='ink')outline('#8b7f6e',.35,1.2);

      c.strokeStyle=rgba(th.hl||s.accent,.3);c.lineWidth=1;c.beginPath();
      c.roundRect(l.x+7,at+7,l.w-14,l.height-14,Math.max(0,r-6));c.stroke()}

  }
