  if(l.titles.length){
    const bw=l.boxW,bh=l.boxH;
    const al=['left','center','right'].includes(s.chapAlign)?s.chapAlign:'center';
    const inset=f==='swiss'?0:f==='editorial'?40:36;
    const bx=al==='center'?l.x+(l.w-bw)/2:al==='right'?l.x+l.w-inset-bw:l.x+inset;
    const by=at-Math.round(bh/2);

function drawFoot(c,s,H){
  const f=fam(s.preset),foot=+s.footerHeight,col=headInk(s);
  const mid=centeredHead(f),x=mid?W/2:96;
  const face=size=>f==='editorial'||f==='ink'?serif(c,size,false):f==='tradition'?kai(c,size,false):font(c,size,false);

function drawRichLine(c,line,y,s,size,x,width,emph,face){
  const align=['left','center','right'].includes(s.textAlign)?s.textAlign:'left';

  for(const tk of line.toks){
    runFont(c,size,tk.st,face);

/* measure-only pass: returns the layout and total height */
function layout(c,s){
  const mode=s.preset,f=fam(mode),g=geometry(mode),fs=+s.fontSize,lh=fs*(+s.lineHeight||1.95);
  const out=[];let y=+s.headerHeight;

    if(s.bodyList)runs=listify(runs);
    const textLines=plainOf(runs).length?richWrap(c,runs,g.inner,fs,bodyFaceOf(s)):[];
    const cols=clamp(+sec.columns||1,1,3), pw=(g.inner-(cols-1)*16)/cols;

      const group=ratios.slice(i,i+cols);
      rows.push({from:i,count:group.length,height:Math.max(...group.map(r=>pw/r))});
    }
    const bm=boxMetrics(f);
    boxFace(c,s,bm);
    const titles=sec.title?wrap(c,sec.title,g.titleWidth):[];
    const boxH=titles.length?titles.length*bm.line+bm.padY*2:0;
    const boxW=titles.length
      ?Math.min(g.w-72,Math.max(...titles.map(t=>c.measureText(t).width))+bm.padX*2)
      :0;
    /* the box straddles the panel edge, so the panel drops by half a box */
    const overhang=titles.length?Math.round(boxH/2):0;
    const cardTop=y+overhang;
    const bodyTop=titles.length?Math.round(boxH/2)+48:46;
    const contentH=textLines.length*lh
      +(rows.length&&textLines.length?34:0)

    const height=bodyTop+contentH+g.padBottom;
    out.push({sec,index,y:cardTop,height,textLines,rows,pw,titles,bodyTop,boxW,boxH,bm,...g});

let revision=0,pending=Promise.resolve();
async function draw(){
  const rev=++revision;
  const s=structuredClone(state);
  if(!themes[s.preset])s.preset='plain';
  s.card=s.card||'#ffffff';
  const srcs=[s.background,s.headerImage,s.footerImage,logoSrc(s),...s.sections.flatMap(x=>x.images)].filter(Boolean);
  const loaded=await Promise.all(srcs.map(getImage));
  await ensureFonts(s);
  if(rev!==revision)return null;
  const bySrc=new Map(srcs.map((v,i)=>[v,loaded[i]]));

  /* photo aspect ratios feed the measure pass */
  for(const sec of s.sections){
    sec._ratios=sec.images.map(src=>{const im=bySrc.get(src);return im?im.width/im.height:null}).filter(Boolean);
    sec._photos=sec.images.map(src=>bySrc.get(src)).filter(Boolean);
  }

  const temp=document.createElement('canvas'),c=temp.getContext('2d');
  if(headerIsAuto(s)){s.headerHeight=autoHeaderHeight(c,s,bySrc.get(logoSrc(s)));lastAutoHead=s.headerHeight}
  const m=layout(c,s);
  if(m.H>MAX_H){
    $('#dims').innerHTML=`<b>1080</b> × ${m.H} px — 超出上限`;
    toast(`长图 ${m.H} px 超过浏览器画布上限 ${MAX_H} px，请减少篇章或照片`);
    return null;
  }
  temp.width=W;temp.height=m.H;

  drawBackground(c,s,m.H);
  if(s.backgroundMode==='full'&&s.background){
    const im=bySrc.get(s.background);
    if(im)c.drawImage(im,0,0,W,m.H);
  } else {
    cover(c,bySrc.get(s.headerImage),0,0,W,+s.headerHeight);
    cover(c,bySrc.get(s.footerImage),0,m.H-(+s.footerHeight),W,+s.footerHeight);
  }
  drawHead(c,s,bySrc.get(logoSrc(s)));

  for(const l of m.layouts){
    drawFrame(c,s,l);
    const emph=emphColor(s);
    let cy=l.y+l.bodyTop;
    for(const line of l.textLines){drawRichLine(c,line,cy+m.fs,s,m.fs,l.bodyX,l.inner,emph,bodyFaceOf(s));cy+=m.lh}
    if(l.rows.length&&l.textLines.length)cy+=34;
    const photos=l.sec._photos;
    for(const row of l.rows){
      for(let i=0;i<row.count;i++){
        const im=photos[row.from+i];if(!im)continue;
        const ih=l.pw*im.height/im.width;
        drawPhoto(c,im,l.bodyX+i*(l.pw+16),cy,l.pw,ih,photoR(s));
      }
      cy+=row.height+16;
    }
  }

  drawFoot(c,s,m.H);

  if(rev!==revision)return null;
  const dest=$('#poster');
  dest.width=W;dest.height=m.H;
  dest.getContext('2d').drawImage(temp,0,0);
  applyZoom();
  $('#dims').innerHTML=`<b>1080</b> × ${m.H} px`;
  updateSliceCounts(m.H);
  return m.H;
}
let drawTimer=null;
function scheduleDraw(){clearTimeout(drawTimer);drawTimer=setTimeout(()=>{pending=draw()},130)}
function drawNow(){clearTimeout(drawTimer);pending=draw();return pending}

/* ---------------- zoom ---------------- */
function applyZoom(){

  if(v==='fit'){cv.style.width='100%';cv.style.maxWidth=W+'px';return}
  cv.style.maxWidth='none';cv.style.width=W*Number(v)+'px';
}
$('#zoom').onchange=()=>{applyZoom();try{localStorage.setItem('poster-zoom',$('#zoom').value)}catch(e){}};
/* 50% by default on a desktop, fit-to-width on a phone; a choice is remembered */
{let z=null;try{z=localStorage.getItem('poster-zoom')}catch(e){}
  const ok=[...$('#zoom').options].some(o=>o.value===z);
  $('#zoom').value=ok?z:(matchMedia('(max-width:860px)').matches?'fit':'0.5');}
/* drag the preview with the mouse to move around a zoomed poster */
{const wrap=$('#canvaswrap');let pan=null;
  wrap.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='mouse'||e.button!==0)return;
    pan={x:e.clientX,y:e.clientY,l:wrap.scrollLeft,t:wrap.scrollTop};
    wrap.setPointerCapture(e.pointerId);wrap.classList.add('panning');e.preventDefault();
  });
  wrap.addEventListener('pointermove',e=>{if(!pan)return;
    wrap.scrollLeft=pan.l-(e.clientX-pan.x);wrap.scrollTop=pan.t-(e.clientY-pan.y)});
  const end=()=>{pan=null;wrap.classList.remove('panning')};
  wrap.addEventListener('pointerup',end);wrap.addEventListener('pointercancel',end);
}

/* ---------------- slice counts ---------------- */
function updateSliceCounts(H){
  const h=H||$('#poster').height;
  document.querySelectorAll('.ratio').forEach(el=>{
    const sh=Number(el.dataset.h),n=Math.max(1,Math.ceil(h/sh));
    const cnt=el.querySelector('.cnt');
    if(cnt)cnt.textContent=n+' 张';
  });
}

/* ---------------- theme thumbnails ---------------- */
const thumbCache=new Map();
const THUMB_W=1080, THUMB_H=1420, THUMB_CROP=1000;   /* rendered tall, shown cropped to header + first card */
const putThumb=(cv,img)=>{const x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);x.drawImage(img,0,0,THUMB_W,THUMB_CROP,0,0,cv.width,cv.height)};
function themeThumb(id,cv){

  const t=themes[id],d=t.defaults;
  const off=document.createElement('canvas');off.width=THUMB_W;off.height=THUMB_H;
  const c=off.getContext('2d');
  const s={preset:id,bg:t.bg,accent:t.accent,text:t.text,card:t.card,
    headerHeight:560,footerHeight:150,gap:d.gap,radius:d.radius,headAlign:'center',
    org:'品牌 / 团队',headLines:[{t:'标题示例',size:0,b:true,font:'theme',tone:'main'},{t:'副标题说明',size:0,b:false,font:'theme',tone:'soft'}],
    footer:'落款',date:'2026年10月',textAlign:'left'};
  drawBackground(c,s,THUMB_H);
  drawHead(c,s,null);

function syncFoldbar(root){
  const bar=root.querySelector(':scope>.foldbar');if(!bar)return;
  const all=[...root.querySelectorAll('details.fold')],n=all.filter(d=>d.open).length;
  bar.querySelector('.foldbar-lab').innerHTML=`<b>${n}</b> / ${all.length} 个模块已展开`;

/* Opening slides the body down and fades it in; closing folds it back up.
   `delay` lets 全部展开 / 全部折叠 ripple through the modules one after another. */
function animateFold(d,open,delay=0){
  if(d.dataset.anim||d.open===open)return;
  const body=d.querySelector(':scope>.grp-body, :scope>.chap-body');
  if(!body||matchMedia('(prefers-reduced-motion: reduce)').matches){d.open=open;return}
  d.dataset.anim='1';
  const done=()=>{body.style.overflow='';delete d.dataset.anim};
  body.style.overflow='hidden';
  if(open){
    d.open=true;
    const cs=getComputedStyle(body),h=body.offsetHeight;
    const a=body.animate([
      {height:'0px',paddingTop:'0px',paddingBottom:'0px',opacity:0,transform:'translateY(-8px)'},
      {height:h+'px',paddingTop:cs.paddingTop,paddingBottom:cs.paddingBottom,opacity:1,transform:'translateY(0)'}
    ],{duration:300,delay,fill:'backwards',easing:'cubic-bezier(.2,.8,.2,1)'});
    a.onfinish=a.oncancel=done;
  } else {
    const cs=getComputedStyle(body),h=body.offsetHeight;
    const a=body.animate([
      {height:h+'px',paddingTop:cs.paddingTop,paddingBottom:cs.paddingBottom,opacity:1},
      {height:'0px',paddingTop:'0px',paddingBottom:'0px',opacity:0}
    ],{duration:220,delay,easing:'cubic-bezier(.4,0,.6,1)'});
    a.onfinish=()=>{d.open=false;done()};
    a.oncancel=done;
  }
  const sm=d.querySelector(':scope>summary');
  sm?.animate([{transform:'scale(1)'},{transform:'scale(.985)'},{transform:'scale(1)'}],{duration:260,delay,easing:'ease-out'});
}

  const d=sm.parentElement,body=d.querySelector(':scope>.grp-body, :scope>.chap-body');
  if(!body||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  e.preventDefault();
  animateFold(d,!d.open);
});

function syncChapterSummary(i){
  const card=document.querySelector(`.chap[data-panel="chapter-${i}"]`);
  if(!card)return;
  const sec=state.sections[i],cols=clamp(+sec.columns||1,1,3);
  const strong=card.querySelector('.chap-head strong'),small=card.querySelector('.chap-head small');
  if(strong)strong.textContent=sec.title||'未命名篇章';
  const tag=card.querySelector('.chap-tag');if(tag)tag.hidden=!!sec.title;
  if(small)small.textContent=`${sec.images.length} 张照片${sec.hints?.length?` · 待补 ${sec.hints.length}`:''} · ${{1:'单列大图',2:'双列拼图',3:'三列拼图'}[cols]}`;
}
function syncFromEditor(ed){
  const sec=state.sections[+ed.dataset.rich];if(!sec)return;
  sec.rich=toRuns(scanEditor(ed).chars);sec.text=plainOf(sec.rich);
  commitSoon();persist();scheduleDraw();
}
function writeBack(ed,chars,a,b){
  const sec=state.sections[+ed.dataset.rich];if(!sec)return;
  sec.rich=toRuns(chars);sec.text=plainOf(sec.rich);
  ed.innerHTML=runsToHtml(sec.rich);
  ed.focus();setOffsets(ed,a,b);
  commit();persist();scheduleDraw();refreshRtBar(ed);
}
function applyFormat(ed,flag){
  const off=document.activeElement===ed||ed.contains(getSelection()?.anchorNode)?getOffsets(ed):null;
  if(!off||off[0]===off[1]){toast('先在正文里选中要设置的文字');ed.focus();return}
  const[a,b]=off;
  const chars=toChars(toRuns(scanEditor(ed).chars));
  if(flag==='x'){for(let k=a;k<b;k++)for(const f of FLAGS)chars[k][f]=false}
  else{
    const seg=chars.slice(a,b).filter(ch=>ch.c!=='\n');
    const on=!seg.every(ch=>ch[flag]);
    for(let k=a;k<b;k++)if(chars[k].c!=='\n')chars[k][flag]=on;
  }
  writeBack(ed,chars,a,b);
}
function insertPlain(ed,text){
  text=String(text).replace(/\r\n?/g,'\n');
  const[a,b]=getOffsets(ed)||[0,0];
  const chars=toChars(toRuns(scanEditor(ed).chars));
  let base=chars[a-1];if(!base||base.c==='\n')base=NOFLAG;
  const ins=[];
  for(let k=0;k<text.length;k++){const c=text[k];ins.push(c==='\n'?{c,...NOFLAG}:{c,b:!!base.b,i:!!base.i,u:!!base.u,m:!!base.m})}
  writeBack(ed,chars.slice(0,a).concat(ins,chars.slice(b)),a+text.length,a+text.length);
}
function refreshRtBar(ed){
  const bar=ed.closest('.rt')?.querySelector('.rt-bar');if(!bar)return;
  const on={};
  const off=document.activeElement===ed?getOffsets(ed):null;
  if(off){
    const chars=scanEditor(ed).chars,[a,b]=off;
    const seg=(a===b?chars.slice(Math.max(0,a-1),a):chars.slice(a,b)).filter(ch=>ch.c!=='\n');
    for(const f of FLAGS)on[f]=seg.length>0&&seg.every(ch=>ch[f]);
  }
  bar.querySelectorAll('[data-rt]').forEach(btn=>{if(btn.dataset.rt!=='x')btn.setAttribute('aria-pressed',String(!!on[btn.dataset.rt]))});
}
/* toolbar buttons must not take focus, or the text selection is lost */
document.addEventListener('mousedown',e=>{if(e.target.closest?.('[data-rt]'))e.preventDefault()});
document.addEventListener('selectionchange',()=>{
  const ed=document.activeElement?.closest?.('.rt-ed');if(ed)refreshRtBar(ed);
});
document.addEventListener('compositionend',e=>{
  const ed=e.target.closest?.('.rt-ed');if(ed)syncFromEditor(ed);
});
document.addEventListener('keydown',e=>{
  const ed=e.target.closest?.('.rt-ed');if(!ed)return;
  if(e.isComposing||e.keyCode===229)return;    /* Chinese IME is choosing a word */
  const mod=e.metaKey||e.ctrlKey,k=e.key.toLowerCase();
  if(e.key==='Enter'){e.preventDefault();insertPlain(ed,'\n');return}
  if(mod&&!e.altKey&&!e.shiftKey&&(k==='b'||k==='i'||k==='u')){e.preventDefault();applyFormat(ed,k)}
});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains('rt-ed')){
    if(e.isComposing)return;
    syncFromEditor(t);return;
  }
  if(t.dataset.key){
    const k=t.dataset.key;
    if(bounds[k]){
      if(t.value===''||!Number.isFinite(Number(t.value)))return;
      state[k]=clamp(Number(t.value),bounds[k][0],bounds[k][1]);
      const o=$('#o-'+k);
      if(o)o.textContent=fmtVal(k,state[k]);
    } else state[k]=t.value;
    if(k==='footer'||k==='date'||k==='org')syncEdges();
    if(k==='logoX')document.querySelectorAll('[data-logox]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.logox)===state.logoX)));
    if(k==='patternCustom'){
      state.patternColor='custom';
      document.querySelectorAll('[data-pcolor]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pcolor==='custom')));
      const dot=document.querySelector('[data-pcolor="custom"] .dot');if(dot)dot.style.background=t.value;
    }
    commitSoon();persist();scheduleDraw();
    return;
  }
  if(t.dataset.prop!==undefined&&t.dataset.i!==undefined){
    const i=+t.dataset.i;
    state.sections[i][t.dataset.prop]=t.value;
    if(t.dataset.prop==='title')syncChapterSummary(i);
    commitSoon();persist();scheduleDraw();
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='patternFoot'||t.id==='patternHalo'){state[t.id]=t.checked;commit();persist();scheduleDraw();return}
  if(t.name==='slice'){
    state.sliceHeight=Number(t.value);
    document.querySelectorAll('.ratio').forEach(el=>el.dataset.on=(+el.dataset.h===+t.value)?'1':'0');
    commit();persist();return;
  }
  if(t.dataset.key==='backgroundMode'){commit();renderControls();scheduleDraw();return}
  if(t.dataset.upload&&t.files&&t.files[0]){
    try{
      state[t.dataset.upload]=await prepImage(t.files[0],t.dataset.upload==='logo'?'logo':'photo');
      if(t.dataset.upload==='logo')state.logoBrand='custom';
      commit();renderControls();await drawNow();toast('图片已更新');
    }catch(err){toast(err.message||'图片读取失败')}
    t.value='';return;
  }
  if(t.dataset.photos!==undefined&&t.files&&t.files.length){
    await addPhotos(+t.dataset.photos,[...t.files]);t.value='';
  }
});
async function addPhotos(i,files){
  const sec=state.sections[i];if(!sec)return;
  let ok=0,fail=0;
  for(const f of files){
    try{sec.images.push(await prepImage(f,'photo'));ok++}catch(e){fail++}
  }
  folds['图文篇章']=true;saveFolds();
  commit();renderControls();
  const card=document.querySelector(`.chap[data-panel="chapter-${i}"]`);
  if(card)card.open=true;
  await drawNow();
  toast(fail?`加入 ${ok} 张，${fail} 张无法读取`:`已加入 ${ok} 张照片`);
}

document.addEventListener('click',async e=>{

    state.logoX=Number(btn.dataset.logox);

    commit();persist();scheduleDraw();return;
  }
  if(btn.dataset.foldall!==undefined){
    const open=btn.dataset.foldall==='1';
    const list=[...btn.closest('.panel').querySelectorAll('details.fold')].filter(d=>d.open!==open);
    if(!list.length){btn.animate([{transform:'translateX(0)'},{transform:'translateX(-3px)'},{transform:'translateX(3px)'},{transform:'translateX(0)'}],{duration:240});return}
    btn.querySelector('svg')?.animate([{transform:'scale(1)'},{transform:'scale(1.35)'},{transform:'scale(1)'}],{duration:360,easing:'cubic-bezier(.2,.8,.2,1)'});
    list.forEach((d,i)=>animateFold(d,open,i*55));
    return;
  }
  if(btn.dataset.rt){
    const ed=btn.closest('.rt')?.querySelector('.rt-ed');
    if(ed)applyFormat(ed,btn.dataset.rt);
    return;
  }
  if(btn.dataset.fmt){
    state[btn.dataset.fmt]=!state[btn.dataset.fmt];
    btn.setAttribute('aria-pressed',String(state[btn.dataset.fmt]));
    commit();persist();scheduleDraw();return;
  }
  if(btn.dataset.cols){
    const i=+btn.dataset.i;
    state.sections[i].columns=+btn.dataset.cols;

function dropTarget(el){
  if(!el.closest)el=el.parentElement;
  if(!el)return null;
  const ed=el.closest('.rt-ed');
  if(ed)return{kind:'photos',i:+ed.dataset.rich,el:ed};

  if(imp)return{kind:'import',el:imp};
  const photos=el.closest('[data-drop-photos]'),key=el.closest('[data-drop-key]');
  return photos?{kind:'photos',i:+photos.dataset.dropPhotos,el:photos}
    :key?{kind:'key',key:key.dataset.dropKey,el:key}:null;
}
const dragHasFiles=e=>[...(e.dataTransfer?.types||[])].includes('Files');
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{
  const t=dropTarget(e.target);if(!t)return;
  if(t.el.classList.contains('rt-ed')&&!dragHasFiles(e))return;   /* moving text inside the editor */
  e.preventDefault();t.el.classList.add('on');

/* store-only ZIP, so a set of slices arrives as one file instead of N
   separate downloads (PNG bytes are already compressed). */
const crcTable=(()=>{const t=new Uint32Array(256);
  for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[i]=c>>>0}
  return t})();
function crc32(buf){let c=0xFFFFFFFF;for(let i=0;i<buf.length;i++)c=crcTable[(c^buf[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function makeZip(entries){
  const enc=new TextEncoder(),body=[],central=[];let offset=0;
  for(const e of entries){
    const name=enc.encode(e.name),data=e.data,crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);
    lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    body.push(new Uint8Array(lh.buffer),name,data);
    const cd=new DataView(new ArrayBuffer(46));
    cd.setUint32(0,0x02014b50,true);cd.setUint16(4,20,true);cd.setUint16(6,20,true);cd.setUint16(8,0x0800,true);
    cd.setUint16(10,0,true);cd.setUint16(12,0,true);cd.setUint16(14,0,true);
    cd.setUint32(16,crc,true);cd.setUint32(20,data.length,true);cd.setUint32(24,data.length,true);
    cd.setUint16(28,name.length,true);cd.setUint16(30,0,true);cd.setUint16(32,0,true);
    cd.setUint16(34,0,true);cd.setUint16(36,0,true);cd.setUint32(38,0,true);cd.setUint32(42,offset,true);
    central.push(new Uint8Array(cd.buffer),name);
    offset+=30+name.length+data.length;
  }
  const centralSize=central.reduce((n,a)=>n+a.length,0);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(4,0,true);end.setUint16(6,0,true);
  end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);
  end.setUint32(12,centralSize,true);end.setUint32(16,offset,true);end.setUint16(20,0,true);
  return new Blob([...body,...central,new Uint8Array(end.buffer)],{type:'application/zip'});
}

/* ---------------- one-click import ----------------
   Reads a Word file (.docx) or plain text / Markdown (an AI reply) into the
   chapters, keeping the current theme, pattern and logo. Both formats go
   through the same paragraph list, so the same rules apply to each:
     标题 style / "# " / 主标题：      → main title
     副标题 style / "> " / 副标题：     → subtitle
     落款： 日期： 品牌：               → those fields (结束语： is ignored)
     标题 1 style / "## " / 【篇章】     → a new chapter
     text before the first chapter     → the untitled lead chapter
     bold · italic · underline · 高亮 / **x** *x* <u>x</u> ==x==  → kept
     pictures in Word                  → that chapter's photos
     【照片：开班合影】                   → a "待补照片" note on that chapter
   When a document has no heading styles at all, a short line that is wholly
   bold or starts with 一、/（一）/1. is taken as a chapter title. */

let impMode='replace';
try{impMode=localStorage.getItem('poster-impmode')==='append'?'append':'replace'}catch(e){}
let impReport='';

/* --- reading a .docx (a ZIP) with the browser's own inflater --- */
async function readZip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf),dec=new TextDecoder();
  let eocd=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-66000);i--)
    if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}
  if(eocd<0)throw new Error('这不是有效的 Word 文件（.docx）');
  const count=dv.getUint16(eocd+10,true);let p=dv.getUint32(eocd+16,true);
  const files=new Map();
  for(let k=0;k<count;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true);
    const nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true);
    const off=dv.getUint32(p+42,true),name=dec.decode(u8.subarray(p+46,p+46+nl));
    files.set(name,{method,csize,off});
    p+=46+nl+xl+cl;
  }
  const get=async name=>{
    const f=files.get(name);if(!f)return null;
    const start=f.off+30+dv.getUint16(f.off+26,true)+dv.getUint16(f.off+28,true);
    const raw=u8.subarray(start,start+f.csize);
    if(f.method===0)return raw.slice();
    if(f.method!==8||typeof DecompressionStream==='undefined')throw new Error('浏览器版本太旧，无法读取 Word，请升级浏览器或改用粘贴文字');
    const ds=new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(ds).arrayBuffer());
  };
  return{files,get,text:async n=>{const b=await get(n);return b?dec.decode(b):null}};
}
const IMG_MIME={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',bmp:'image/bmp'};
const kids=(el,name)=>[...el.children].filter(c=>c.localName===name);
const kid=(el,name)=>[...(el?.children||[])].find(c=>c.localName===name)||null;
const wval=el=>el?(el.getAttribute('w:val')??[...el.attributes].find(a=>a.localName==='val')?.value??''):null;
const isOn=el=>el!=null&&!/^(0|false|off|none)$/i.test(wval(el)||'');

async function parseDocx(file){
  const zip=await readZip(await file.arrayBuffer());
  const xml=await zip.text('word/document.xml');
  if(!xml)throw new Error('这个 Word 文件里没有正文，请确认是 .docx 格式');
  const P=new DOMParser(),doc=P.parseFromString(xml,'application/xml');
  /* styles: id → kind, following basedOn so a custom heading still counts */
  const styles=new Map();
  const sx=await zip.text('word/styles.xml');
  if(sx)for(const st of P.parseFromString(sx,'application/xml').getElementsByTagNameNS('*','style')){
    const id=st.getAttribute('w:styleId');if(!id)continue;
    const name=(wval(kid(st,'name'))||'').toLowerCase().replace(/\s+/g,' ').trim();
    const ol=wval(kid(kid(st,'pPr'),'outlineLvl'));
    styles.set(id,{name,based:wval(kid(st,'basedOn')),ol:ol==null?null:+ol});
  }
  const kindOfStyle=id=>{
    for(let k=0;k<6&&id;k++){
      const s=styles.get(id);if(!s)break;
      if(/^(title|标题)$/.test(s.name))return 'title';
      if(/^(subtitle|副标题)$/.test(s.name))return 'subtitle';
      if(/^(heading ?1|标题 ?1)$/.test(s.name)||s.ol===0)return 'h1';
      if(/^(heading ?[2-9]|标题 ?[2-9])$/.test(s.name)||(s.ol!=null&&s.ol>0&&s.ol<9))return 'h2';
      id=s.based;
    }
    return 'body';
  };
  /* relationships: rId → media path */
  const rels=new Map();
  const rx=await zip.text('word/_rels/document.xml.rels');
  if(rx)for(const r of P.parseFromString(rx,'application/xml').getElementsByTagNameNS('*','Relationship')){
    if(r.getAttribute('TargetMode')==='External')continue;
    let t=r.getAttribute('Target')||'';
    t=t.startsWith('/')?t.slice(1):'word/'+t.replace(/^\.\//,'');
    rels.set(r.getAttribute('Id'),t);
  }
  let skipped=0;
  const picture=async rid=>{
    const path=rels.get(rid);if(!path)return null;
    const ext=(path.split('.').pop()||'').toLowerCase();
    if(!IMG_MIME[ext]){skipped++;return null}
    const bytes=await zip.get(path);if(!bytes){skipped++;return null}
    return new Blob([bytes],{type:IMG_MIME[ext]});
  };
  const paras=[];
  const readPara=async p=>{
    const pPr=kid(p,'pPr');
    let kind=kindOfStyle(wval(kid(pPr,'pStyle')));
    const ol=wval(kid(pPr,'outlineLvl'));
    if(kind==='body'&&ol!=null)kind=+ol===0?'h1':+ol<9?'h2':'body';
    const runs=[],images=[];
    const walk=async node=>{
      for(const ch of node.children){
        const n=ch.localName;
        if(n==='r'){
          const rPr=kid(ch,'rPr');
          const hl=kid(rPr,'highlight'),shd=kid(rPr,'shd');
          const fill=shd?.getAttribute('w:fill')||'';
          const f={b:isOn(kid(rPr,'b')),i:isOn(kid(rPr,'i')),u:isOn(kid(rPr,'u')),
            m:isOn(hl)||(!!fill&&!/^(auto|ffffff|)$/i.test(fill))};
          for(const c of ch.children){
            const cn=c.localName;
            if(cn==='t')runs.push({t:c.textContent,...f});
            else if(cn==='tab')runs.push({t:' ',...f});
            else if(cn==='br'||cn==='cr')runs.push({t:'\n',...f});
          }
          /* pictures: DrawingML blips, skipping the VML fallback copies */
          const blips=[...ch.getElementsByTagNameNS('*','blip')].filter(b=>!b.closest('Fallback'));
          const ids=blips.map(b=>b.getAttribute('r:embed')||[...b.attributes].find(a=>a.localName==='embed')?.value).filter(Boolean);
          if(!ids.length)for(const v of ch.getElementsByTagNameNS('*','imagedata')){
            const id=v.getAttribute('r:id')||[...v.attributes].find(a=>a.localName==='id')?.value;if(id)ids.push(id);
          }
          for(const id of ids){const b=await picture(id);if(b)images.push(b)}
        } else if(['hyperlink','ins','smartTag','fldSimple','sdt','sdtContent','customXml'].includes(n))await walk(ch);
      }
    };
    await walk(p);
    paras.push({kind,runs,images,center:wval(kid(pPr,'jc'))==='center'});
  };
  const walkBlock=async el=>{
    for(const ch of el.children){
      const n=ch.localName;
      if(n==='p')await readPara(ch);
      else if(n==='tbl'){for(const p of ch.getElementsByTagNameNS('*','p'))if(!p.closest('txbxContent'))await readPara(p)}

  const body=doc.getElementsByTagNameNS('*','body')[0];
  if(!body)throw new Error('没有读到 Word 正文');
  await walkBlock(body);
  return{paras,skipped};
}

/* --- reading Markdown / plain text --- */
function parseInline(s,f={}){
  const out=[];
  const re=/\*\*(.+?)\*\*|__(.+?)__|==(.+?)==|<u>(.+?)<\/u>|(?<![*\w])\*(?![\s*])(.+?)(?<!\s)\*(?!\*)/g;
  let last=0,m;
  while((m=re.exec(s))){
    if(m.index>last)out.push({t:s.slice(last,m.index),...f});
    const [inner,flag]=m[1]!=null?[m[1],'b']:m[2]!=null?[m[2],'b']:m[3]!=null?[m[3],'m']:m[4]!=null?[m[4],'u']:[m[5],'i'];
    out.push(...parseInline(inner,{...f,[flag]:true}));
    last=re.lastIndex;
  }
  if(last<s.length)out.push({t:s.slice(last),...f});
  return out;
}
function parseText(text){
  const paras=[];let sawTitle=false;
  text=String(text).replace(/\r\n?/g,'\n');
  /* a reply copied whole: keep only what is inside the code block(s) */
  const blocks=[...text.matchAll(/```[^\n]*\n([\s\S]*?)(?:```|$)/g)].map(m=>m[1]).filter(b=>b.trim());
  if(blocks.length)text=blocks.join('\n');
  for(let line of String(text).replace(/\r\n?/g,'\n').split('\n')){
    line=line.replace(/ /g,' ').replace(/\s+$/,'');
    if(/^\s*```/.test(line))continue;                 /* code fences around the reply */
    if(/^\s*([-*_]\s*){3,}$/.test(line))continue;     /* horizontal rules */
    if(!line.trim())continue;
    let kind='body',m;
    if((m=line.match(/^\s*#\s+(.*)$/))){kind=sawTitle?'h1':'title';sawTitle=true;line=m[1]}
    else if((m=line.match(/^\s*##\s+(.*)$/))){kind='h1';line=m[1]}
    else if((m=line.match(/^\s*#{3,6}\s+(.*)$/))){kind='h2';line=m[1]}
    else if((m=line.match(/^\s*>\s?(.*)$/))){kind=paras.length&&paras[paras.length-1].kind==='title'?'subtitle':'body';line=m[1]}
    else line=line.replace(/^\s*(?:[-*+•·]\s+)/,'').replace(/^\s+/,'');
    line=line.replace(/\\([*_=#>\[\]()`~-])/g,'$1');
    paras.push({kind,runs:parseInline(line),images:[]});
  }
  return{paras,skipped:0};
}

/* --- turning paragraphs into chapters --- */
const FIELD_RE=/^\s*(?:\*\*)?\s*(主标题|副标题|标题|落款|日期|结束语|状态|品牌|导语)\s*(?:\*\*)?\s*[:：]\s*(?:\*\*)?\s*/;
const CHAPTER_RE=/^\s*(?:\*\*)?\s*(?:【\s*篇章(?:标题)?\s*(?:[0-9一二三四五六七八九十]+)?\s*[:：]?\s*】|篇章(?:标题)?\s*(?:[0-9一二三四五六七八九十]+)?\s*[:：])\s*/;
const HINT_RE=/[【\[［]\s*(?:照片|图片|配图)\s*[:：]?\s*([^】\]］]*)[】\]］]/g;
const NOTE_RE=/^\s*[【\[]\s*说明\s*[】\]]/;
const BYLINE_RE=/^\s*[（(]?\s*(?:来源|作者|通讯员|记者|编辑|责任编辑|责编|审核|审校|签发|供稿|撰稿|摄影|摄|图|文|图\/文|文\/图|图文)\s*[:：/｜|]|^\s*[（(]\s*(?:通讯员|记者|作者|实习生)\s+\S/;
const NUM_HEAD_RE=/^\s*(?:[一二三四五六七八九十]{1,3}[、.．]|（[一二三四五六七八九十]{1,3}）|\([一二三四五六七八九十]{1,3}\)|第[一二三四五六七八九十0-9]{1,3}[章篇部分节][\s、：:]?|\d{1,2}[、．]|\d{1,2}\.(?!\d))/;
const runsText=runs=>runs.map(r=>r.t).join('');
function stripPrefix(runs,len){
  const out=[];let n=len;
  for(const r of runs){
    if(n>=r.t.length){n-=r.t.length;continue}
    out.push({...r,t:r.t.slice(n)});n=0;
  }
  return out;
}
/* cut character ranges out of styled runs (a marker may span several runs) */
function dropRanges(runs,ranges){
  const out=[];let pos=0;
  for(const r of runs){
    let t='';
    for(const ch of r.t){if(!ranges.some(([a,b])=>pos>=a&&pos<b))t+=ch;pos+=ch.length}
    if(t)out.push({...r,t});
  }
  return out;
}
function trimRuns(runs){
  const r=runs.filter(x=>x.t);
  while(r.length&&!r[0].t.trim())r.shift();
  while(r.length&&!r[r.length-1].t.trim())r.pop();
  if(r.length){r[0]={...r[0],t:r[0].t.replace(/^\s+/,'')};const k=r.length-1;r[k]={...r[k],t:r[k].t.replace(/\s+$/,'')}}
  return r;
}
function assemble({paras,skipped}){
  const out={title:null,subtitle:null,fields:{},lead:{title:'',paras:[],images:[],hints:[]},sections:[],skipped};
  const cur=()=>out.sections[out.sections.length-1]||out.lead;
  /* pass 1: tidy text, pull out hints, notes and labels */
  const items=[];
  for(const p of paras){
    let runs=p.runs.map(r=>({...r,t:r.t.replace(/ /g,' ')}));
    const hints=[];
    let txt=runsText(runs);
    if(NOTE_RE.test(txt)){if(p.images.length)items.push({kind:'body',runs:[],images:p.images,hints});continue}
    const found=[...txt.matchAll(HINT_RE)];
    if(found.length){
      for(const m of found)hints.push(m[1].trim()||'照片');
      runs=dropRanges(runs,found.map(m=>[m.index,m.index+m[0].length]));
    }
    runs=trimRuns(runs);txt=runsText(runs);
    let kind=p.kind,label=null,tagged=false,m;
    if(kind==='body'||kind==='h2'){
      if((m=txt.match(/^\s*【\s*篇章(?:标题)?\s*[0-9一二三四五六七八九十]*\s*[:：]\s*([^】]+)】\s*$/))){kind='h1';tagged=true;runs=[{t:m[1].trim()}]}
      else if((m=txt.match(CHAPTER_RE))){kind='h1';tagged=true;runs=trimRuns(stripPrefix(runs,m[0].length))}
      else if((m=txt.match(FIELD_RE))){label=m[1];runs=trimRuns(stripPrefix(runs,m[0].length))}
    }
    /* press-release bylines (来源、通讯员、编辑…) stay out of the long image */
    if(!label&&BYLINE_RE.test(runsText(runs))&&runsText(runs).length<=48){
      if(p.images.length||hints.length)items.push({kind:'body',runs:[],images:p.images,hints});
      continue;
    }
    items.push({kind,label,tagged,runs,images:p.images,hints,center:!!p.center});
  }
  const hasTitle=items.some(x=>x.kind==='title'||x.label==='主标题'||x.label==='标题');
  /* No title style or label: the document's first line is its title — a press
     release headline is often long, bold, centred or styled 标题 1, and should
     go to the header rather than become the first chapter. A line that reads
     like a sentence (ends in 。！？) or is numbered (一、…) is left alone. */
  if(!hasTitle){
    const at=items.findIndex(x=>runsText(x.runs).trim());
    const first=items[at],t=first&&runsText(first.runs).trim();
    if(first&&!first.label&&!first.tagged&&first.kind!=='subtitle'&&t.length<=64
      &&!/[。！？；…!?;]$/.test(t)&&!NUM_HEAD_RE.test(t)){
      first.kind='title';
      /* the line under it is a subtitle when it starts with a dash or is a short centred line */
      const nx=items.slice(at+1).find(x=>runsText(x.runs).trim());
      const nt=nx&&runsText(nx.runs).trim();
      if(nx&&!nx.label&&!nx.tagged&&nx.kind!=='h1'&&nt.length<=60&&!/[。！？]$/.test(nt)
        &&(/^[—–-]{1,2}/.test(nt)||(nx.center&&first.center)))nx.kind='subtitle';
    }
  }
  const hasH1=items.some(x=>x.kind==='h1');
  const headingLike=x=>{
    const t=runsText(x.runs).trim();
    if(!t||t.length>26||/[。；，,;：:！？!?]$/.test(t))return false;
    const solid=x.runs.filter(r=>r.t.trim());
    return x.kind==='h2'||NUM_HEAD_RE.test(t)||(solid.length>0&&solid.every(r=>r.b));
  };
  /* No subheadings anywhere (a typical press release): split at the photos
     instead. Text runs on until a photo; the photos close that chapter, and
     the next paragraph opens a new, untitled one. A 【照片：…】 note counts as
     a photo position too. */
  const byPhoto=!hasH1&&!items.some(x=>x.kind!=='title'&&x.kind!=='subtitle'&&!x.label&&headingLike(x));
  /* pass 2: build */
  for(const x of items){
    const t=runsText(x.runs).trim();
    if(x.kind==='title'&&out.title==null&&t){out.title=t}
    else if(x.kind==='subtitle'&&out.subtitle==null&&t){out.subtitle=t}
    else if(x.label){
      const map={主标题:'title',标题:'title',副标题:'subtitle',落款:'footer',日期:'date',结束语:null,状态:null,品牌:'org'};
      if(x.label==='导语'){if(t)out.lead.paras.push(x.runs)}
      else if(map[x.label]==='title'){if(out.title==null)out.title=t;else if(t)cur().paras.push(x.runs)}
      else if(map[x.label]==='subtitle')out.subtitle=t;
      else if(t&&map[x.label])out.fields[map[x.label]]=t;
    }
    else if(x.kind==='h1'||(!hasH1&&x.kind!=='title'&&x.kind!=='subtitle'&&headingLike(x))){
      out.sections.push({title:t,paras:[],images:[],hints:[]});
    }
    else if(t){
      if(byPhoto&&(cur().images.length||cur().hints.length))out.sections.push({title:'',paras:[],images:[],hints:[]});
      cur().paras.push(x.kind==='h2'||x.kind==='title'||x.kind==='subtitle'?x.runs.map(r=>({...r,b:true})):x.runs);
    }
    cur().images.push(...x.images);
    cur().hints.push(...x.hints);
  }
  out.byPhoto=byPhoto&&out.sections.length>0;
  return out;
}

const autoCols=n=>n<=1?(n===1?1:2):n===2||n===4?2:3;
function paraRuns(paras){
  const chars=[];
  paras.forEach((runs,k)=>{
    if(k)chars.push({c:'\n',...NOFLAG});
    for(const r of runs)for(const c of r.t)chars.push({c,b:!!r.b,i:!!r.i,u:!!r.u,m:!!r.m});
  });
  return toRuns(chars);
}
async function importParsed(parsed){
  const doc=assemble(parsed);
  const all=[];
  if(doc.lead.paras.length||doc.lead.images.length||doc.lead.hints.length)all.push(doc.lead);
  all.push(...doc.sections);
  if(!all.length)throw new Error('没有识别到篇章或正文，请检查格式');
  const total=all.reduce((n,s)=>n+s.images.length,0);
  let done=0,bad=0;
  const secs=[];
  for(const s of all){
    const images=[];
    for(const b of s.images){
      done++;if(total>3)toast(`正在处理照片 ${done} / ${total}…`);
      try{images.push(await prepImage(b,'photo'))}catch(e){bad++}
    }
    const rich=paraRuns(s.paras);
    secs.push({title:s.title,text:plainOf(rich),rich,images,columns:autoCols(images.length),...(s.hints.length?{hints:s.hints}:{})});
  }
  const got=[];
  if(impMode==='replace'){
    state.sections=secs;
    if(doc.title!=null||doc.subtitle!=null){
      /* keep the look of the current first two lines, swap in the new words */
      const old=state.headLines||[];
      const mainStyle=old[0]||{size:0,b:true,font:'theme',tone:'main'},subStyle=old[1]||{size:0,b:false,font:'theme',tone:'soft'};
      const next=[];
      if(doc.title!=null)next.push(cleanHeadLine({...mainStyle,t:doc.title}));
      if(doc.subtitle!=null)next.push(cleanHeadLine({...subStyle,t:doc.subtitle}));
      state.headLines=next;got.push('标题栏');
    }
    const fn={footer:'落款',date:'日期',org:'品牌'};
    for(const[k,v]of Object.entries(doc.fields)){state[k]=v;got.push(fn[k])}
  } else state.sections.push(...secs);
  const photos=secs.reduce((n,s)=>n+s.images.length,0),hints=secs.reduce((n,s)=>n+(s.hints?.length||0),0);
  const lines=[`${impMode==='replace'?'已导入':'已追加'} ${secs.length} 个篇章、${photos} 张照片${got.length?'，以及'+got.join('、'):''}。`];
  const skip=doc.skipped+bad;
  if(skip)lines.push(`${skip} 张图片格式不支持（如 EMF、TIFF），已跳过，可以在篇章里重新加。`);
  if(doc.byPhoto)lines.push('文档里没有小标题，已按照片的位置分段；需要标题条的篇章，展开后填上标题即可。');
  if(hints)lines.push(`${hints} 处「待补照片」已标在对应篇章里。`);
  if(impMode==='append'&&(doc.title||doc.subtitle))lines.push('追加模式不改标题栏。');
  impReport=lines.join('\n');
  folds['图文篇章']=true;saveFolds();
  commit();renderControls();
  await drawNow();
  if(/超出上限/.test($('#dims')?.textContent||'')){
    impReport+='\n长图超过浏览器画布上限，请减少照片或篇章。';renderControls();
  }
  toast(lines[0],{label:'撤销',run:undo});
}
async function importFile(file){
  const name=(file.name||'').toLowerCase();
  try{
    if(/\.docx$/.test(name)||file.type==='application/vnd.openxmlformats-officedocument.wordprocessingml.document'){
      toast('正在读取 Word…');await importParsed(await parseDocx(file));
    } else if(/\.doc$/.test(name))throw new Error('不支持旧版 .doc，请在 Word / WPS 里「另存为 .docx」再导入');
    else if(/\.(md|markdown|txt)$/.test(name)||/^text\//.test(file.type))await importParsed(parseText(await file.text()));
    else if(/\.json$|\.oneimg$/.test(name))throw new Error('工程文件请用「输出 → 草稿与工程 → 导入工程」');
    else throw new Error('请选择 .docx、.md 或 .txt 文件');
  }catch(err){toast(err.message||'导入失败');console.error(err)}
}

async function copyText(text){

  ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.select();

/* --- a Word template with the right styles, built on the spot --- */
function xmlEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function templateDocx(){
  const enc=new TextEncoder();
  const R=(t,o={})=>`<w:r>${o.b||o.h||o.gray?`<w:rPr>${o.b?'<w:b/>':''}${o.gray?'<w:color w:val="8A8A8A"/><w:sz w:val="19"/>':''}${o.h?'<w:highlight w:val="yellow"/>':''}</w:rPr>`:''}<w:t xml:space="preserve">${xmlEsc(t)}</w:t></w:r>`;
  const Pp=(runs,style)=>`<w:p>${style?`<w:pPr><w:pStyle w:val="${style}"/></w:pPr>`:''}${runs}</w:p>`;
  const note=t=>Pp(R('【说明】'+t,{gray:true}));
  const body=[
    note('这是「长图交付工具」的导入模板。灰色的【说明】行导入时会自动忽略，可以不删。'),
    Pp(R('让每一次行动，都留下清晰成果'),'Title'),
    Pp(R('项目进展与精彩记录'),'Subtitle'),
    Pp(R('落款：'+(state.footer||'郑州智博'))),
    Pp(R('日期：'+(state.date||''))),
    note('下面这段是导语，不加标题，会成为长图里第一张没有标题条的卡片。'),
    Pp(R('一个想法从提出到落地，离不开清晰目标、持续行动和彼此协作。本次记录汇集了项目推进过程中的重要节点、关键成果与精彩瞬间。')),
    note('每个篇章：标题用样式「标题 1」，下面写正文。需要强调的字加粗或用黄色高亮。'),
    Pp(R('明确方向  共识启程'),'Heading1'),
    Pp(R('项目启动阶段，大家围绕目标、范围和时间安排进行了充分沟通，')+R('明确了 XX 项重点任务',{b:true})+R('，让每一步行动都有依据。')),
    note('把这个篇章的照片插在这里（插入 → 图片，版式选「嵌入型」）。暂时没有照片就写一行【照片：要放什么】。'),
    Pp(R('【照片：开班仪式合影】')),
    Pp(R('专注行动  稳步推进'),'Heading1'),
    Pp(R('执行过程中，大家持续跟进进度，及时记录发现的问题与新的想法，')+R('一次次沟通与落实',{h:true})+R('，让计划逐渐变成看得见的成果。')),
    Pp(R('【照片：分组研讨现场】')),
    Pp(R('沉淀成果  继续前行'),'Heading1'),
    Pp(R('阶段工作已经完成，新的可能也由此展开。我们将把这次积累的经验保留下来，在后续行动中不断优化。'))
  ].join('');
  const W_NS='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"';
  const docXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ${W_NS}><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="851" w:footer="992" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const font='<w:rFonts w:ascii="Microsoft YaHei" w:hAnsi="Microsoft YaHei" w:eastAsia="微软雅黑" w:cs="Microsoft YaHei"/>';
  const sty=(id,name,ppr,rpr,extra='')=>`<w:style w:type="paragraph" w:styleId="${id}"><w:name w:val="${name}"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/>${extra}<w:qFormat/><w:pPr>${ppr}</w:pPr><w:rPr>${rpr}</w:rPr></w:style>`;
  const stylesXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles ${W_NS}><w:docDefaults><w:rPrDefault><w:rPr>${font}<w:sz w:val="22"/><w:szCs w:val="22"/><w:lang w:val="en-US" w:eastAsia="zh-CN"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="120" w:line="360" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>`
    +`<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>`
    +sty('Title','Title','<w:jc w:val="center"/><w:spacing w:before="240" w:after="120"/>','<w:b/><w:sz w:val="44"/><w:szCs w:val="44"/>','<w:uiPriority w:val="10"/>')
    +sty('Subtitle','Subtitle','<w:jc w:val="center"/><w:spacing w:after="360"/>','<w:color w:val="595959"/><w:sz w:val="28"/><w:szCs w:val="28"/>','<w:uiPriority w:val="11"/>')
    +sty('Heading1','heading 1','<w:keepNext/><w:spacing w:before="360" w:after="160"/><w:outlineLvl w:val="0"/>','<w:b/><w:color w:val="1F4E79"/><w:sz w:val="32"/><w:szCs w:val="32"/>','<w:uiPriority w:val="9"/>')
    +`</w:styles>`;
  const entries=[
    ['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`],
    ['_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`],
    ['word/_rels/document.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ['word/document.xml',docXml],
    ['word/styles.xml',stylesXml]
  ].map(([name,s])=>({name,data:enc.encode(s)}));
  return new Blob([makeZip(entries)],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

/* --- panel markup and events --- */
function importPanel(){
  return `<section class="grp"><h2>一键导入</h2>
      <p class="sub">AI 写好的文字稿或 Word，一次导入成篇章</p>
      <div class="grp-body">
        <ol class="imp-steps">
          <li><b>1</b><span>复制提示词，连同材料发给 AI</span></li>
          <li><b>2</b><span>把 AI 的回复或 Word 导进来</span></li>
          <li><b>3</b><span>在「风格」里挑主题、调样式</span></li>
        </ol>
        <div class="f"><span class="lab">第一步 · 复制提示词</span>
          <div class="imp-prompts">
            <button type="button" class="imp-card" data-prompt="text"><strong>文字版提示词</strong><small>DeepSeek · Kimi · 豆包</small></button>
            <button type="button" class="imp-card" data-prompt="word"><strong>Word 版提示词</strong><small>能直接生成文件的 AI</small></button>
          </div>
          <button type="button" class="imp-link" data-imp="template">不用 AI？下载 Word 模板，自己填字插图 →</button>
        </div>
        <div class="f"><span class="lab">第二步 · 导入<span class="opt">只换文字和照片，样式不变</span></span>
          <div class="drop" data-drop-import>
            <p>把 Word（.docx）或文字稿（.txt / .md）拖到这里</p>
            <label class="pick">选择文件<input type="file" accept=".docx,.md,.markdown,.txt,text/plain,text/markdown,application/vnd.openxmlformats-officedocument.wordprocessingml.document" data-import-file></label>
          </div>
          <textarea id="impText" rows="4" placeholder="或者把 AI 的回复粘贴到这里。建议点回复里代码块右上角的「复制」，格式最完整。"></textarea>
          <button type="button" class="btn primary" data-imp="paste" style="justify-content:center">导入粘贴的内容</button>
        </div>
        <div class="f"><span class="lab">导入方式</span>
          <div class="seg" role="group" aria-label="导入方式" style="align-self:flex-start">
            <button type="button" data-impmode="replace" aria-pressed="${impMode==='replace'}">替换现有篇章</button>
            <button type="button" data-impmode="append" aria-pressed="${impMode==='append'}">追加到末尾</button>
          </div></div>
        ${impReport?`<div class="imp-report" role="status">${impReport.split('\n').map(l=>`<p>${esc(l)}</p>`).join('')}</div>`:''}
      </div></section>`;
}
document.addEventListener('click',async e=>{
  const btn=e.target.closest('button');if(!btn)return;
  if(btn.dataset.prompt){
    const ok=await copyText(promptText(btn.dataset.prompt));
    if(ok){
      btn.classList.add('done');setTimeout(()=>btn.classList.remove('done'),1600);
      toast('提示词已复制：发给 AI，再把你的材料贴在后面');
    } else {
      const ta=$('#impText');ta.value=promptText(btn.dataset.prompt);ta.focus();ta.select();
      toast('浏览器不让自动复制，提示词已放进下面的框里，请按 Ctrl+C 复制');
    }
  } else if(btn.dataset.imp==='template'){
    try{const r=await offerFile('长图导入模板.docx',templateDocx());toast(r==='declined'?'已取消':'模板已下载：按里面的说明填写，再拖回来导入')}
    catch(err){toast(err.message||'下载失败')}
  } else if(btn.dataset.imp==='paste'){
    const t=$('#impText')?.value||'';
    if(!t.trim()){toast('先把 AI 的回复粘贴到框里');$('#impText')?.focus();return}
    try{await importParsed(parseText(t))}catch(err){toast(err.message||'导入失败')}
  } else if(btn.dataset.hintRm!==undefined){
    const sec=state.sections[+btn.dataset.i];if(!sec?.hints)return;
    sec.hints.splice(+btn.dataset.j,1);if(!sec.hints.length)delete sec.hints;
    commit();persist();renderControls();
  } else if(btn.dataset.impmode){
    impMode=btn.dataset.impmode;try{localStorage.setItem('poster-impmode',impMode)}catch(e){}
    btn.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.importFile!==undefined&&t.files?.[0]){const f=t.files[0];t.value='';importFile(f)}
});

/* --- header line editor events --- */
function hlStyle(i){
  const inp=document.querySelector(`[data-hl-text="${i}"]`),l=state.headLines[i];if(!inp||!l)return;
  const rs=document.querySelector(`[data-hl-act="auto"][data-i="${i}"]`);if(rs)rs.hidden=!l.size;
  inp.style.fontSize=hlPx(hlSize(i))+'px';inp.style.fontWeight=l.b?700:400;inp.style.fontFamily=hlFamily(l.font);
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset?.hlText!==undefined){
    const l=state.headLines[+t.dataset.hlText];if(!l)return;
    l.t=t.value;syncEdges();commitSoon();persist();scheduleDraw();
  } else if(t.dataset?.hlSize!==undefined){
    const l=state.headLines[+t.dataset.hlSize],v=Number(t.value);
    if(l&&t.value===''){l.size=0;hlStyle(+t.dataset.hlSize);commitSoon();persist();scheduleDraw();return}
    if(!l||!Number.isFinite(v)||v<16||v>160)return;   /* wait until the number is complete */
    l.size=Math.round(v);hlStyle(+t.dataset.hlSize);commitSoon();persist();scheduleDraw();
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset?.hlSize!==undefined){
    const i=+t.dataset.hlSize,l=state.headLines[i];if(!l)return;
    l.size=t.value===''?0:clamp(Math.round(Number(t.value)||hlSize(i)),16,160);t.value=l.size||'';hlStyle(i);commit();persist();scheduleDraw();
  } else if(t.dataset?.hlFont!==undefined||t.dataset?.hlTone!==undefined){
    const i=+(t.dataset.hlFont??t.dataset.hlTone),l=state.headLines[i];if(!l)return;
    if(t.dataset.hlFont!==undefined)l.font=t.value;else l.tone=t.value;
    hlStyle(i);commit();persist();scheduleDraw();
  }
});
document.addEventListener('click',e=>{
  const btn=e.target.closest('button');if(!btn)return;
  if(btn.dataset.hauto){
    state.headerAuto=btn.dataset.hauto==='1';
    /* switching to manual starts from the height auto just used */
    if(!state.headerAuto&&lastAutoHead)state.headerHeight=lastAutoHead;
    commit();persist();renderControls();scheduleDraw();return;
  }
  if(btn.dataset.halign){
    state.headAlign=btn.dataset.halign;
    btn.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));
    commit();persist();scheduleDraw();return;
  }
  const act=btn.dataset.hlAct;if(!act)return;
  const L=state.headLines||(state.headLines=[]),i=+btn.dataset.i,l=L[i];
  if(act==='add'){
    const last=L[L.length-1];
    L.push(cleanHeadLine({...(last||{tone:'soft'}),size:L.length>1?(last?.size||0):0,t:'',b:last?last.b&&L.length>1:false}));
    commit();persist();renderControls();
    document.querySelector(`[data-hl-text="${L.length-1}"]`)?.focus();
    return;
  }
  if(!l)return;
  if(act==='auto'){
    l.size=0;const n=document.querySelector(`[data-hl-size="${i}"]`);if(n)n.value='';
    hlStyle(i);commit();persist();scheduleDraw();return;
  }
  if(act==='minus'||act==='plus'){
    l.size=clamp(hlSize(i)+(act==='plus'?4:-4),16,160);
    const n=document.querySelector(`[data-hl-size="${i}"]`);if(n)n.value=l.size;
    hlStyle(i);commitSoon();persist();scheduleDraw();return;
  }
  if(act==='bold'){l.b=!l.b;btn.setAttribute('aria-pressed',String(l.b));hlStyle(i);commit();persist();scheduleDraw();return}
  if(act==='del')L.splice(i,1);
  else if(act==='up'&&i>0)[L[i-1],L[i]]=[L[i],L[i-1]];
  else if(act==='down'&&i<L.length-1)[L[i+1],L[i]]=[L[i],L[i+1]];
  commit();persist();renderControls();scheduleDraw();
});

/* ---------------- boot ---------------- */
renderControls();
refreshHistory();
if(document.fonts&&document.fonts.load){
  Promise.race([Promise.all(['400','700'].map(w=>document.fonts.load(`${w} 40px "Noto Serif SC"`,
    '品牌团队标题示例副标题说明篇章正文内容示意展示这套主题的排版落款2026年10月'))),new Promise(r=>setTimeout(r,4000))])
    .then(()=>{thumbCache.clear();paintThumbs()}).catch(()=>{});
}
drawNow();
if(matchMedia('(max-width:860px)').matches)setView('edit');
new ResizeObserver(()=>applyZoom()).observe($('#canvaswrap'));
{const work=$('#work'),split=$('#splitter');
  let ratio=null,drag=null;
  try{const r=Number(localStorage.getItem('poster-rail'));if(r>0&&r<1)ratio=r}catch(e){}
  const limits=()=>{const w=work.getBoundingClientRect().width;return{w,min:300,max:Math.max(300,w-12-380)}};
  function apply(){
    if(matchMedia('(max-width:860px)').matches||ratio===null){work.style.removeProperty('--rail-w');return}
    const{w,min,max}=limits();
    const px=clamp(Math.round(w*ratio),min,max);
    work.style.setProperty('--rail-w',px+'px');
    split.setAttribute('aria-valuenow',String(Math.round(px/w*100)));
  }
  function setPx(px){const{w,min,max}=limits();ratio=clamp(px,min,max)/w;apply()}
  const save=()=>{try{ratio===null?localStorage.removeItem('poster-rail'):localStorage.setItem('poster-rail',String(ratio))}catch(e){}};
  split.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    drag=e.pointerId;split.setPointerCapture(e.pointerId);split.classList.add('dragging');
    document.body.classList.add('resizing');e.preventDefault();
  });
  split.addEventListener('pointermove',e=>{if(drag!==e.pointerId)return;setPx(e.clientX-work.getBoundingClientRect().left-6)});
  const end=e=>{if(drag!==e.pointerId)return;drag=null;split.classList.remove('dragging');document.body.classList.remove('resizing');save()};
  split.addEventListener('pointerup',end);split.addEventListener('pointercancel',end);
  split.addEventListener('dblclick',()=>{ratio=null;apply();save()});
  split.addEventListener('keydown',e=>{
    if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();
    const cur=$('#rail').getBoundingClientRect().width,{min,max}=limits();
    setPx(e.key==='Home'?min:e.key==='End'?max:cur+(e.key==='ArrowLeft'?-1:1)*(e.shiftKey?60:20));save();
  });
  new ResizeObserver(apply).observe(work);apply();
}
</script>
